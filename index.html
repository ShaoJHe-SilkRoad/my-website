    <style>
      /* Design Tokens */
      :root {
        --bg: #eef1ef;
        --bg-cool: #e4ebe9;
        --bg-soft: var(--bg-cool);
        --bg-support: #d9e1df;
        --surface: #f9faf7;
        --surface-muted: #dce2df;
        --surface-strong: #fffefa;
        --ink: #101820;
        --ink-soft: #22323b;
        --text: var(--ink);
        --heading: var(--ink);
        --muted: #5b6c73;
        --muted-2: #7a8588;
        --accent: #2c4853;
        --accent-strong: #111f27;
        --accent-soft: #42696b;
        --blue-black: #111f27;
        --slate-blue: #2c4853;
        --quiet-teal: #42696b;
        --champagne: #b7a16d;
        --champagne-soft: rgba(183, 161, 109, 0.12);
        --sage: #738b84;
        --line: rgba(16, 24, 32, 0.13);
        --line-strong: rgba(16, 24, 32, 0.24);
        --shadow: 0 24px 70px rgba(16, 24, 32, 0.12);
        --shadow-soft: 0 14px 36px rgba(16, 24, 32, 0.075);
        --shadow-tight: 0 8px 18px rgba(16, 24, 32, 0.08);
        --container: 1180px;
        --measure: 44rem;
        --radius: 0.5rem;
        --radius-large: 0.92rem;
        --font-body: "Manrope", "Helvetica Neue", Arial, sans-serif;
        --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
        --section-space: clamp(4.6rem, 8vw, 7.6rem);
        --site-header-offset: 4.75rem;
        --hero-surface: var(--surface);
        --hero-line: var(--line);
        --hero-accent: var(--slate-blue);
        --icu-bg: #e8ecea;
        --icu-surface: #f8faf7;
        --icu-surface-soft: #edf2f0;
        --icu-line: rgba(47, 75, 85, 0.18);
        --icu-accent: #354f5a;
        --ltc-bg: #eef2f1;
        --ltc-surface: #fbfaf7;
        --ltc-surface-soft: #eef2f1;
        --ltc-line: rgba(73, 108, 112, 0.18);
        --ltc-accent: var(--quiet-teal);
        --contact-bg: #17262e;
        --contact-surface: rgba(251, 250, 247, 0.06);
        --contact-line: rgba(251, 250, 247, 0.16);
        --contact-text: #f3f1ec;
        --contact-chip: #d2c390;
        --portrait-image: url("portrait-side-profile-web.jpg");
        --hero-photo: none;
        --icu-photo: none;
        --ltc-photo: none;
        --contact-photo: none;
        --hero-photo-opacity: 0;
        --icu-photo-opacity: 0;
        --ltc-photo-opacity: 0;
        --contact-photo-opacity: 0;
      }

      /* Base */
      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, rgba(222, 232, 230, 0.82) 0%, rgba(238, 241, 239, 0) 22rem),
          linear-gradient(180deg, var(--bg) 0%, #e8ecea 52%, var(--bg-cool) 100%);
        color: var(--text);
        font-family: var(--font-body);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        transition: background-color 320ms ease;
      }

      img {
        display: block;
        max-width: 100%;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.74;
      }

      p + p {
        margin-top: 1rem;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--heading);
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: 0;
      }

      .name-accent {
        color: var(--slate-blue);
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      :focus-visible {
        outline: 3px solid var(--accent-soft);
        outline-offset: 4px;
      }

      .skip-link {
        position: absolute;
        top: -3rem;
        left: 1rem;
        z-index: 50;
        padding: 0.8rem 1rem;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--surface-strong);
        color: var(--heading);
        transition: top 180ms ease;
      }

      .skip-link:focus {
        top: 1rem;
      }

      /* Layout */
      .page-shell {
        min-height: 100vh;
        padding-top: var(--site-header-offset);
        position: relative;
        isolation: isolate;
      }

      .container {
        width: min(calc(100% - 2rem), var(--container));
        margin: 0 auto;
      }

      .header-row,
      .site-name,
      .brand-lockup,
      .header-actions-shell,
      .site-nav,
      .hero-stage,
      .hero-main,
      .hero-aside,
      .hero-evidence,
      .current-board,
      .current-secondary,
      .work-layout,
      .contact-card {
        min-width: 0;
      }

      .site-header {
        --header-height-expanded: 4.75rem;
        --header-current-height: var(--header-height-expanded);
        --logo-height-ratio: 0.72;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        background: rgba(238, 241, 239, 0.96);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 12px 32px rgba(16, 24, 32, 0.045);
        transition:
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .header-row {
        display: grid;
        gap: 0.62rem;
        align-items: center;
        min-height: var(--header-current-height);
        padding: 0.48rem 0;
        transition:
          min-height 180ms ease,
          padding 180ms ease,
          gap 180ms ease;
      }

      .header-actions-shell {
        display: flex;
        flex-wrap: wrap;
        gap: 0.72rem;
        align-items: center;
        justify-content: flex-end;
        align-self: center;
        transition: gap 180ms ease;
      }

      .header-tools {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.4rem;
        align-items: center;
      }

      .control-group {
        display: grid;
        gap: 0.35rem;
      }

      .control-label {
        display: none;
        color: var(--accent);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .segmented-control {
        display: inline-flex;
        align-items: center;
        gap: 0.24rem;
        padding: 0.18rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(251, 250, 247, 0.72);
      }

      .control-button {
        min-height: 2.08rem;
        padding: 0.4rem 0.66rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 180ms ease,
          color 180ms ease,
          transform 180ms ease;
      }

      .control-button:hover,
      .control-button:focus-visible,
      .control-button.is-active {
        color: var(--heading);
        background: rgba(47, 75, 85, 0.1);
      }

      .site-name {
        display: flex;
        align-self: stretch;
        align-items: center;
        min-height: 0;
        color: var(--accent-strong);
        line-height: 1;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 0.82rem;
        height: 100%;
        min-height: 0;
        min-width: 0;
      }

      .brand-mark {
        display: flex;
        align-items: center;
        width: auto;
        height: calc(var(--header-current-height) * var(--logo-height-ratio));
        flex: 0 0 auto;
        overflow: visible;
        transition: height 180ms ease;
      }

      .brand-logo {
        display: block;
        width: auto;
        height: 100%;
        max-height: none;
        object-fit: contain;
      }

      .brand-wordmark {
        display: grid;
        align-content: center;
        gap: 0.08rem;
        min-width: 0;
      }

      .brand-name {
        color: var(--accent-strong);
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.1;
        white-space: nowrap;
      }

      .brand-name--short {
        display: none;
      }

      .brand-support {
        color: var(--slate-blue);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.1;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .site-nav {
        display: flex;
        gap: 0.48rem;
        overflow-x: auto;
        padding-bottom: 0.1rem;
        scrollbar-width: none;
      }

      .site-nav::-webkit-scrollbar {
        display: none;
      }

      .site-nav a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.24rem;
        border-radius: 999px;
        padding: 0.4rem 0.68rem;
        color: var(--ink-soft);
        font-size: 0.86rem;
        font-weight: 700;
        white-space: nowrap;
        transition:
          color 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible,
      .site-nav a[aria-current="page"] {
        color: var(--heading);
        background: rgba(44, 72, 83, 0.1);
      }

      main section {
        padding: var(--section-space) 0;
        border-top: 1px solid var(--line);
        position: relative;
        overflow: clip;
        isolation: isolate;
        scroll-margin-top: calc(var(--site-header-offset) + 1.25rem);
      }

      main section:first-child {
        border-top: 0;
      }

      .section-grid,
      .contact-grid {
        display: grid;
        gap: 2.2rem;
      }

      .section-heading {
        display: grid;
        gap: 0.9rem;
        align-content: start;
      }

      .section-heading h2 {
        max-width: 11ch;
        font-size: clamp(2.55rem, 5vw, 4.8rem);
        line-height: 0.92;
      }

      .section-heading p {
        max-width: 32rem;
      }

      .section-content {
        min-width: 0;
      }

      .section-content > p {
        max-width: var(--measure);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        color: var(--slate-blue);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 2.75rem;
        height: 1px;
        background: currentColor;
        opacity: 0.42;
      }

      /* Components */
      .panel {
        border: 1px solid var(--panel-line, var(--line));
        border-radius: var(--radius);
        background: var(--panel-surface, var(--surface));
        box-shadow: var(--panel-shadow, var(--shadow-soft));
      }

      .button,
      .text-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.85rem 1.3rem;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        font-size: 0.94rem;
        font-weight: 600;
        transition:
          transform 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease;
      }

      .button {
        background: var(--blue-black);
        border-color: var(--blue-black);
        color: var(--surface);
      }

      .button:hover,
      .button:focus-visible {
        transform: translateY(-1px);
        background: var(--ink-soft);
        box-shadow: 0 10px 20px rgba(18, 26, 32, 0.12);
      }

      .text-link {
        background: transparent;
        color: var(--heading);
      }

      .text-link:hover,
      .text-link:focus-visible {
        transform: translateY(-1px);
        border-color: var(--line-strong);
        background: rgba(18, 26, 32, 0.04);
      }

      .detail-list {
        display: grid;
        gap: 0.95rem;
      }

      .detail-item {
        display: grid;
        gap: 0.35rem;
      }

      .detail-label,
      .status-label,
      .proof-label,
      .signal-label {
        color: var(--slate-blue);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .detail-item p,
      .signal-text {
        color: var(--heading);
        font-size: 0.96rem;
        line-height: 1.62;
      }

      .signal-text {
        display: grid;
        gap: 0.18rem;
      }

      .signal-text strong {
        font-weight: 700;
        color: inherit;
      }

      .signal-line {
        display: block;
      }

      /* Hero */
      .hero {
        padding: clamp(1rem, 2.4vw, 2.1rem) 0 clamp(4rem, 7vw, 6.4rem);
        background:
          linear-gradient(180deg, rgba(222, 232, 230, 0.9) 0%, rgba(238, 241, 239, 0) 76%),
          var(--bg);
      }

      .hero-stage {
        position: relative;
        display: grid;
        grid-template-areas:
          "main"
          "portrait"
          "credentials";
        gap: clamp(0.82rem, 1.8vw, 1.25rem);
        align-items: stretch;
        min-height: clamp(32rem, 64vh, 42rem);
        padding: clamp(0.88rem, 2.4vw, 1.85rem);
        border: 1px solid rgba(16, 24, 32, 0.16);
        border-radius: var(--radius-large);
        background:
          linear-gradient(135deg, rgba(250, 251, 248, 0.98) 0%, rgba(240, 244, 242, 0.96) 48%, rgba(226, 235, 233, 0.92) 100%);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero-stage::before {
        content: "";
        position: absolute;
        inset: clamp(0.55rem, 1vw, 0.8rem);
        border: 1px solid rgba(16, 24, 32, 0.08);
        border-radius: calc(var(--radius-large) - 0.32rem);
        pointer-events: none;
      }

      .hero-main {
        grid-area: main;
        display: grid;
        gap: clamp(0.9rem, 1.7vw, 1.18rem);
        align-content: center;
        max-width: 100%;
        padding: clamp(0.18rem, 1vw, 0.82rem);
        position: relative;
        z-index: 1;
      }

      .hero-identity {
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        width: max-content;
        max-width: 100%;
        padding: 0.2rem 0 0.85rem;
        border-bottom: 1px solid rgba(16, 24, 32, 0.16);
      }

      .hero-identity img {
        width: clamp(5rem, 8vw, 6.8rem);
        height: auto;
        object-fit: contain;
      }

      .hero-identity span {
        color: var(--slate-blue);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.3;
        text-transform: uppercase;
      }

      .hero-main h1 {
        max-width: 9.8ch;
        font-size: clamp(3.55rem, 7.7vw, 6.35rem);
        line-height: 0.88;
      }

      .hero-role {
        max-width: 37rem;
        color: var(--heading);
        font-size: clamp(1.12rem, 1.8vw, 1.42rem);
        font-weight: 600;
        line-height: 1.42;
      }

      .hero-intro {
        max-width: 38rem;
      }

      .hero-intro p:first-child {
        color: var(--muted);
      }

      .hero-evidence {
        grid-area: credentials;
        position: relative;
        z-index: 1;
        align-self: end;
        padding-top: 0.5rem;
        border-top: 1px solid rgba(16, 24, 32, 0.14);
      }

      .signal-list {
        display: grid;
        gap: 0;
      }

      .signal-item {
        display: grid;
        gap: 0.32rem;
        min-height: 0;
        padding: 0.72rem 0;
        border: 0;
        border-bottom: 1px solid rgba(16, 24, 32, 0.1);
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        align-content: start;
      }

      .signal-item:first-child {
        border-top: 0;
      }

      .signal-item:last-child {
        border-bottom: 0;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 0.2rem;
      }

      .hero-aside {
        grid-area: portrait;
        position: relative;
        z-index: 1;
        display: grid;
        gap: 0.68rem;
        align-content: start;
        padding: 0.62rem;
        border: 1px solid rgba(16, 31, 39, 0.5);
        border-radius: calc(var(--radius-large) - 0.18rem);
        background:
          linear-gradient(180deg, rgba(17, 31, 39, 0.98), rgba(25, 45, 55, 0.96));
        box-shadow: 0 24px 52px rgba(16, 24, 32, 0.18);
      }

      .headshot-shell {
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .headshot-stage {
        position: relative;
        aspect-ratio: 4 / 5.08;
        width: 100%;
        overflow: hidden;
        border-radius: calc(var(--radius-large) - 0.32rem);
        background-color: #bdc7c4;
        background-image:
          linear-gradient(180deg, rgba(17, 31, 39, 0.02), rgba(17, 31, 39, 0.26)),
          var(--portrait-image);
        background-size: cover, cover;
        background-position: center, center 18%;
        box-shadow: inset 0 0 0 1px rgba(251, 250, 246, 0.18);
      }

      .headshot-stage::after {
        content: "";
        position: absolute;
        inset: 0.75rem;
        border: 1px solid rgba(234, 243, 240, 0.26);
        border-radius: calc(var(--radius-large) - 0.48rem);
        pointer-events: none;
      }

      .hero-detail-stack {
        display: grid;
        gap: 0.62rem;
      }

      .hero-profile,
      .hero-practice {
        padding: 0.94rem 1rem;
        border-color: rgba(251, 250, 246, 0.2);
        background: rgba(251, 250, 246, 0.94);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.13);
      }

      .hero-profile .detail-item,
      .hero-practice .detail-item {
        padding-top: 0.72rem;
        border-top: 1px solid var(--line);
      }

      .hero-profile .detail-item:first-child,
      .hero-practice .detail-item:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .hero-profile .detail-item p,
      .hero-practice .detail-item p {
        max-width: 25rem;
        font-size: 0.94rem;
      }

      .hero-status {
        display: grid;
        gap: 0.8rem;
        align-items: start;
        padding: 1rem 1.1rem;
        margin-top: 1rem;
        border: 1px solid rgba(23, 61, 71, 0.14);
        border-radius: 1rem;
        background: rgba(143, 175, 166, 0.12);
      }

      .status-main {
        display: grid;
        gap: 0.3rem;
      }

      .status-title {
        color: var(--heading);
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.45;
      }

      .status-link {
        width: max-content;
        color: var(--accent);
        font-size: 0.92rem;
        font-weight: 700;
        border-bottom: 1px solid rgba(23, 61, 71, 0.24);
      }

      .status-link:hover,
      .status-link:focus-visible {
        border-color: var(--accent);
      }

      /* Current */
      #current {
        --panel-line: rgba(47, 75, 85, 0.16);
        --panel-surface: var(--surface);
        --panel-shadow: var(--shadow-soft);
        background:
          linear-gradient(180deg, #e4ebe9 0%, #edf2f0 100%);
        border-top-color: rgba(47, 75, 85, 0.16);
      }

      #current .eyebrow,
      #current .detail-label,
      #current .proof-label {
        color: var(--slate-blue);
      }

      #icu .section-heading h2,
      #ltc .section-heading h2 {
        max-width: 12ch;
        font-size: clamp(3rem, 6.2vw, 5.6rem);
        line-height: 0.92;
      }

      .current-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: clamp(1.2rem, 3vw, 2.2rem);
        align-items: start;
      }

      .current-heading {
        display: grid;
        gap: 0.95rem;
        align-content: start;
        padding-top: 0.2rem;
      }

      .current-heading h2 {
        max-width: 9ch;
        font-size: clamp(3rem, 5.6vw, 5.2rem);
        line-height: 0.9;
      }

      .current-heading p {
        max-width: 26rem;
        color: var(--ink-soft);
        font-weight: 500;
      }

      .current-board {
        display: grid;
        gap: clamp(1.1rem, 2.5vw, 1.8rem);
        padding: clamp(1.35rem, 3vw, 2.4rem) clamp(1.25rem, 3vw, 2.2rem);
        border-top: 1px solid rgba(16, 24, 32, 0.18);
        border-bottom: 1px solid rgba(16, 24, 32, 0.18);
        border-left: 3px solid rgba(47, 75, 85, 0.42);
        background:
          linear-gradient(90deg, rgba(255, 254, 250, 0.82), rgba(249, 250, 247, 0.42));
      }

      .current-secondary {
        display: grid;
        gap: clamp(0.9rem, 2vw, 1.4rem);
        padding-top: clamp(1rem, 2vw, 1.35rem);
        border-top: 1px solid rgba(16, 24, 32, 0.12);
      }

      .current-card {
        position: relative;
        display: grid;
        gap: 0.7rem;
        min-height: 100%;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        overflow: visible;
      }

      .current-card--pursuits {
        min-height: 0;
        align-content: start;
        color: var(--heading);
        box-shadow: none;
      }

      .current-card--pursuits::before {
        content: none;
      }

      .current-card--pursuits h3,
      .current-card--pursuits .current-card-text {
        color: inherit;
      }

      .current-card--pursuits .stack-link {
        border-color: rgba(47, 75, 85, 0.2);
        background: transparent;
        color: var(--heading);
      }

      .current-card--pursuits .stack-link::after {
        color: rgba(47, 75, 85, 0.72);
      }

      .current-card--pursuits .stack-link:hover,
      .current-card--pursuits .stack-link:focus-visible {
        border-color: rgba(47, 75, 85, 0.34);
        background: rgba(47, 75, 85, 0.06);
      }

      .current-card h3 {
        font-size: clamp(1.32rem, 2.1vw, 1.72rem);
        line-height: 1.08;
      }

      .current-card--pursuits h3 {
        font-size: clamp(1.8rem, 3vw, 2.55rem);
      }

      .current-card-text {
        color: var(--ink-soft);
        font-size: 0.98rem;
        line-height: 1.58;
      }

      .stacked-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.62rem;
        margin-top: 0.35rem;
      }

      .stack-link {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        min-height: 3.15rem;
        padding: 0.76rem 0.95rem;
        border: 1px solid rgba(47, 75, 85, 0.18);
        border-radius: 999px;
        background: transparent;
        color: var(--heading);
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.3;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .stack-link::after {
        content: "->";
        color: rgba(47, 75, 85, 0.72);
        font-size: 0.8rem;
      }

      .stack-link:hover,
      .stack-link:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(47, 75, 85, 0.32);
        background: rgba(255, 255, 255, 0.34);
        box-shadow: none;
      }

      .stack-link--primary-direction {
        border-color: rgba(47, 75, 85, 0.28);
        background: rgba(47, 75, 85, 0.07);
        color: var(--heading);
      }

      .stack-link--primary-direction::after {
        color: rgba(47, 75, 85, 0.8);
      }

      .stack-link--primary-direction:hover,
      .stack-link--primary-direction:focus-visible {
        border-color: rgba(47, 75, 85, 0.4);
        background: rgba(47, 75, 85, 0.1);
      }

      .stack-link--secondary-practice {
        background: rgba(73, 108, 112, 0.06);
      }

      .current-list {
        display: grid;
        gap: 0;
      }

      .current-list-item {
        padding: 0.68rem 0;
        border-top: 1px solid rgba(47, 75, 85, 0.16);
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .current-list-item:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .subpage-view {
        padding-top: clamp(1.6rem, 4vw, 2.5rem);
        background: var(--bg-cool);
        border-top-color: rgba(47, 75, 85, 0.16);
      }

      .subpage-back {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        color: var(--slate-blue);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .subpage-layout {
        display: grid;
        gap: 1rem;
      }

      .subpage-note {
        max-width: 42rem;
        padding: 1.1rem 1.15rem;
        border-top-width: 2px;
        border-top-color: rgba(47, 75, 85, 0.22);
      }

      .subpage-note p {
        font-size: 0.95rem;
      }

      .subpage-view .eyebrow,
      .subpage-view .detail-label {
        color: var(--slate-blue);
      }

      .subpage-view .work-body,
      .subpage-view .work-details {
        border-top-width: 2px;
        border-top-color: rgba(47, 75, 85, 0.22);
        background: var(--surface);
        box-shadow: none;
      }

      /* Current Work */
      .work-layout {
        display: grid;
        gap: 1rem;
      }

      .work-body,
      .work-details {
        padding: clamp(1.35rem, 3vw, 2.2rem);
      }

      .work-body {
        display: grid;
        gap: 1rem;
        border-radius: 0;
        background: rgba(249, 250, 247, 0.48);
        box-shadow: none;
      }

      .work-body-block {
        display: grid;
        gap: 0.55rem;
      }

      .work-body-block + .work-body-block {
        padding-top: 0.8rem;
        border-top: 1px solid rgba(16, 24, 32, 0.1);
      }

      .work-body-block h3 {
        color: var(--heading);
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .work-body p:first-child {
        color: var(--heading);
        font-size: clamp(1.08rem, 1.6vw, 1.2rem);
      }

      .work-emphasis {
        padding-left: 1rem;
        border-left: 2px solid var(--sage);
        color: var(--heading);
        font-weight: 600;
      }

      .work-details {
        --detail-card-line: var(--panel-line, var(--line));
        --detail-card-surface: transparent;
        display: grid;
        gap: 0.9rem;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .work-details .detail-list {
        grid-template-columns: 1fr;
        gap: 0.9rem;
      }

      .work-details .detail-item {
        gap: 0.45rem;
        padding: 0 0 0.95rem;
        border: 0;
        border-bottom: 1px solid var(--detail-card-line);
        border-radius: 0;
        background: var(--detail-card-surface);
      }

      .work-details .detail-item:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .work-details .detail-item p {
        max-width: none;
        font-size: 0.95rem;
        line-height: 1.62;
      }

      .proof-item h3,
      .approach-item h3 {
        font-size: clamp(1.45rem, 2.8vw, 1.9rem);
        line-height: 1.02;
      }

      .photo-backed > .container {
        position: relative;
        z-index: 1;
      }

      .photo-backed::before,
      .photo-backed::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .photo-backed::before {
        z-index: -2;
        background-image: var(--section-photo, none);
        background-size: cover;
        background-position: center;
        filter: none;
        transform: none;
        opacity: 0;
      }

      .photo-backed::after {
        z-index: -1;
        background: var(--section-tint, transparent);
      }

      .hero {
        --section-photo: var(--hero-photo);
        --section-photo-opacity: var(--hero-photo-opacity);
        --section-tint: transparent;
      }

      #icu {
        --panel-line: var(--icu-line);
        --panel-surface: var(--icu-surface);
        --panel-shadow: var(--shadow-soft);
        --section-photo: var(--icu-photo);
        --section-photo-opacity: var(--icu-photo-opacity);
        --section-tint: transparent;
        background: var(--icu-bg);
        border-top-color: var(--icu-line);
      }

      #ltc {
        --panel-line: var(--ltc-line);
        --panel-surface: var(--ltc-surface);
        --panel-shadow: var(--shadow-soft);
        --section-photo: var(--ltc-photo);
        --section-photo-opacity: var(--ltc-photo-opacity);
        --section-tint: transparent;
        background: var(--ltc-bg);
        border-top-color: var(--ltc-line);
      }

      #contact {
        --panel-line: var(--contact-line);
        --panel-surface: var(--contact-surface);
        --panel-shadow: 0 20px 48px rgba(0, 0, 0, 0.18);
        --section-photo: var(--contact-photo);
        --section-photo-opacity: var(--contact-photo-opacity);
        --section-tint: transparent;
        background: var(--contact-bg);
        border-top-color: var(--contact-line);
      }

      #contact .section-heading h2,
      #contact .section-heading p,
      #contact .section-heading .eyebrow,
      #contact .contact-card p,
      #contact .detail-label,
      #contact .footer-summary,
      #contact .footer-note {
        color: var(--contact-text);
      }

      #contact .eyebrow::before {
        background: rgba(234, 243, 240, 0.52);
      }

      #contact .contact-card {
        background: var(--contact-surface);
        border-color: var(--contact-line);
        box-shadow: var(--panel-shadow);
      }

      #icu .eyebrow,
      #icu .detail-label {
        color: var(--icu-accent);
      }

      #icu .section-subtitle,
      #icu .work-details .detail-item {
        border-color: var(--icu-line);
      }

      #icu .work-details {
        --detail-card-line: rgba(122, 91, 73, 0.16);
        --detail-card-surface: rgba(255, 253, 248, 0.28);
      }

      #ltc .eyebrow,
      #ltc .detail-label,
      #ltc .proof-label {
        color: var(--ltc-accent);
      }

      #ltc .section-subtitle,
      #ltc .compact-grid .proof-item,
      #ltc .work-details .detail-item,
      #ltc .teaser-card {
        border-color: var(--ltc-line);
      }

      #ltc .work-details {
        --detail-card-line: rgba(94, 128, 109, 0.16);
        --detail-card-surface: rgba(255, 253, 248, 0.28);
      }

      .super-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(183, 161, 109, 0.28);
        border-radius: 999px;
        background: rgba(183, 161, 109, 0.08);
        color: var(--contact-chip);
        font-size: 0.86rem;
        font-weight: 600;
        letter-spacing: 0;
      }

      .closing-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
      }

      /* Proof */
      .proof-grid {
        display: grid;
        gap: 1rem;
      }

      .proof-item {
        display: grid;
        gap: 0.7rem;
        padding: 1.25rem 1.2rem;
      }

      .proof-item p {
        color: var(--muted);
      }

      .proof-item .proof-meta {
        color: var(--heading);
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.55;
      }

      .proof-link {
        width: max-content;
        color: var(--accent);
        font-size: 0.94rem;
        font-weight: 700;
        border-bottom: 1px solid rgba(23, 61, 71, 0.24);
      }

      .proof-link:hover,
      .proof-link:focus-visible {
        border-color: var(--accent);
      }

      .section-stack {
        display: grid;
        gap: 1.2rem;
      }

      .section-subtitle {
        display: grid;
        gap: 0.45rem;
        padding-top: 1rem;
        border-top: 1px solid var(--panel-line, var(--line));
      }

      .section-subtitle h3 {
        font-size: clamp(1.24rem, 2.2vw, 1.55rem);
        line-height: 1.04;
      }

      .section-subtitle p {
        max-width: 42rem;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .compact-grid,
      .teaser-grid {
        display: grid;
        gap: 1rem;
      }

      .compact-grid .proof-item {
        background: var(--surface);
        box-shadow: none;
      }

      .compact-grid .proof-item .proof-meta {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .teaser-card {
        display: grid;
        gap: 0.7rem;
        padding: 1.2rem 1.15rem;
        background: var(--surface);
        box-shadow: none;
      }

      .teaser-card p {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .teaser-card .proof-label {
        opacity: 0.8;
      }

      .teaser-card h3 {
        font-size: clamp(1.25rem, 2.2vw, 1.5rem);
      }

      .approach-strip,
      .direction-list {
        display: grid;
        gap: 0;
        border-top: 1px solid var(--line);
      }

      .approach-item,
      .direction-item {
        display: grid;
        gap: 0.45rem;
        padding: 1.2rem 0;
        border-bottom: 1px solid var(--line);
      }

      .direction-item strong {
        color: var(--heading);
        font-size: 1.06rem;
      }

      /* Contact */
      .contact-card {
        display: grid;
        gap: 1.25rem;
        padding: clamp(1.45rem, 3vw, 2.1rem);
        max-width: 36rem;
      }

      .contact-actions {
        display: grid;
        gap: 1rem;
      }

      .contact-mail {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: max-content;
        max-width: 100%;
        min-height: 3rem;
        padding: 0.82rem 1.1rem;
        border: 1px solid rgba(234, 243, 240, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--contact-text);
        font-size: 0.94rem;
        font-weight: 600;
        overflow-wrap: anywhere;
        word-break: break-word;
        transition:
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .contact-mail:hover,
      .contact-mail:focus-visible {
        border-color: rgba(234, 243, 240, 0.38);
        background: rgba(255, 255, 255, 0.12);
      }

      .contact-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem 1rem;
      }

      .contact-links a {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 600;
        border-bottom: 1px solid transparent;
      }

      .contact-links a:hover,
      .contact-links a:focus-visible {
        color: var(--heading);
        border-color: var(--heading);
      }

      .footer {
        padding: 2rem 0 2.8rem;
        border-top: 1px solid rgba(251, 250, 246, 0.12);
        background: var(--blue-black);
      }

      .footer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: minmax(3.45rem, 1fr) auto;
        grid-template-areas:
          "summary logo"
          "note note";
        column-gap: 1.05rem;
        row-gap: 0.38rem;
        min-height: 7rem;
        align-items: center;
      }

      .footer-logo {
        grid-area: logo;
        display: block;
        width: clamp(7rem, 11vw, 9rem);
        height: auto;
        justify-self: end;
        align-self: center;
        flex: 0 0 auto;
        object-fit: contain;
        opacity: 0.88;
      }

      .footer-summary {
        grid-area: summary;
        align-self: center;
        max-width: min(42rem, calc(100% - 9.5rem));
        color: var(--surface);
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.55;
      }

      .footer-note {
        grid-area: note;
        justify-self: center;
        align-self: end;
        max-width: min(28rem, 84vw);
        font-size: clamp(0.3rem, 0.5vw, 0.38rem);
        line-height: 1.45;
        text-align: center;
        letter-spacing: 0;
        color: rgba(251, 250, 246, 0.55);
      }

      /* Motion */
      .reveal {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 460ms ease,
          transform 460ms ease;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Responsive */
      @media (min-width: 760px) {
        .header-row {
          display: flex;
          justify-content: space-between;
          gap: 0.9rem;
        }

        .header-actions-shell {
          display: flex;
          flex-wrap: nowrap;
          align-items: center;
          justify-content: flex-end;
          gap: 0.74rem;
        }

        .site-nav {
          gap: 0.42rem;
          overflow: visible;
        }

        .section-grid,
        .contact-grid {
          grid-template-columns: minmax(15rem, 0.8fr) minmax(0, 1.2fr);
          gap: 3rem;
          align-items: start;
        }

        .hero-stage {
          grid-template-columns: minmax(0, 1.14fr) minmax(18rem, 0.76fr);
          grid-template-areas:
            "main portrait"
            "credentials portrait";
          min-height: clamp(32rem, 64vh, 42rem);
        }

        .hero-main {
          max-width: 46rem;
        }

        .signal-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .signal-item--wide {
          grid-column: span 2;
        }

        .current-layout {
          grid-template-columns: minmax(15rem, 0.72fr) minmax(0, 1.28fr);
          gap: clamp(1.4rem, 3vw, 2.4rem);
        }

        .current-secondary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .hero-aside {
          align-self: stretch;
          justify-self: stretch;
        }

        .headshot-shell {
          width: 100%;
        }

        .hero-profile {
          width: 100%;
        }

        .hero-status {
          grid-template-columns: auto minmax(0, 1fr) auto;
          gap: 1rem 1.2rem;
          align-items: center;
        }

        .status-main {
          min-width: 0;
        }

        .work-layout {
          grid-template-columns: minmax(0, 1.12fr) minmax(17rem, 0.88fr);
          align-items: start;
        }

        .subpage-layout {
          grid-template-columns: minmax(0, 1.08fr) minmax(17rem, 0.92fr);
          align-items: start;
        }

        .work-details .detail-list {
          grid-template-columns: 1fr;
        }

        .proof-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .compact-grid,
        .teaser-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .approach-strip,
        .direction-list {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          column-gap: 2rem;
        }
      }

      @media (min-width: 980px) {
        .section-heading {
          position: sticky;
          top: 6.7rem;
        }
      }

      @media (max-width: 1024px) {
        .brand-name--full {
          display: none;
        }

        .brand-name--short {
          display: inline;
        }

        .brand-support {
          display: none;
        }
      }

      @media (max-width: 759px) {
        .header-actions-shell {
          gap: 0.8rem;
        }

        .header-tools {
          gap: 0.5rem;
        }

        .section-grid,
        .contact-grid {
          gap: 1.8rem;
        }

        .hero-stage {
          min-height: auto;
        }

        .hero-aside {
          max-width: min(15.5rem, 78vw);
        }

        .headshot-shell {
          width: min(100%, 15.5rem);
        }

        .headshot-stage {
          width: 100%;
        }

        .panel {
          box-shadow: none;
        }

        .brand-lockup {
          gap: 0.62rem;
        }

        .brand-wordmark {
          display: grid;
        }

        .current-card,
        .subpage-note {
          padding: 1rem;
        }

        .work-details .detail-list {
          grid-template-columns: 1fr;
        }
      }

      html[data-view-mode="desktop"] .header-row {
        display: flex;
        justify-content: space-between;
        gap: 0.9rem;
      }

      html[data-view-mode="desktop"] .header-actions-shell {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.74rem;
      }

      html[data-view-mode="desktop"] .site-nav {
        gap: 0.42rem;
        overflow: visible;
      }

      html[data-view-mode="desktop"] .section-grid,
      html[data-view-mode="desktop"] .contact-grid {
        grid-template-columns: minmax(15rem, 0.8fr) minmax(0, 1.2fr);
        gap: 3rem;
        align-items: start;
      }

      html[data-view-mode="desktop"] .hero-stage {
        grid-template-columns: minmax(0, 1.14fr) minmax(18rem, 0.76fr);
        grid-template-areas:
          "main portrait"
          "credentials portrait";
        min-height: clamp(32rem, 64vh, 42rem);
      }

      html[data-view-mode="desktop"] .signal-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      html[data-view-mode="desktop"] .signal-item--wide {
        grid-column: span 2;
      }

      html[data-view-mode="desktop"] .current-layout {
        grid-template-columns: minmax(15rem, 0.72fr) minmax(0, 1.28fr);
        gap: clamp(1.4rem, 3vw, 2.4rem);
      }

      html[data-view-mode="desktop"] .current-secondary {
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
      }

      html[data-view-mode="desktop"] .hero-aside {
        align-self: stretch;
        justify-self: stretch;
      }

      html[data-view-mode="desktop"] .headshot-shell {
        width: 100%;
      }

      html[data-view-mode="desktop"] .hero-profile {
        width: 100%;

        function writeStorage(key, value) {

            window.localStorage.setItem(key, value);
          } catch (error) {
            return false;
          }

          return true;
        }

        function getInitialLanguage() {

        function renderBrandLockup(content) {
          return (
            '<span class="brand-lockup"><span class="brand-mark" aria-hidden="true"><img class="brand-logo" src="logo-web.png?v=20260529" alt="" width="768" height="512" decoding="async" />' +
            '<\/span><span class="brand-wordmark"><span class="brand-name brand-name--full">' +
            renderSelectiveAccent(content.meta.siteName) +
            '<\/span><span class="brand-name brand-name--short">' +
            renderSelectiveAccent(getBrandShortText(content)) +
            '<\/span><span class="brand-support">' +
            escapeHtml(getBrandSupportText()) +
            "<\/span><\/span><\/span>"
          );
        }

        function renderPresencePreview(channels) {
          return (
            '<div class="presence-preview">' +
            (channels || [])
              .map(function (channel) {
                return (
                  '<div class="presence-row"><span class="presence-icon" aria-hidden="true">' +
                  escapeHtml(channel.icon) +
                  '<\/span><div class="presence-text"><span class="presence-platform">' +
                  escapeHtml(channel.label) +
                  '<\/span><span class="presence-status">' +
                  escapeHtml(channel.status) +
                  "<\/span><\/div><\/div>"
                );
              })
              .join("") +
            "<\/div>"
          );
        }

        function renderCurrentPillars(content) {
          return content.current.pillars
            .map(function (pillar) {
              var pillarBody = pillar.channels && pillar.channels.length
                ? renderPresencePreview(pillar.channels)
                : '<div class="endeavor-notes">' +
                  pillar.notes
                    .map(function (note) {
                      return '<p class="endeavor-note">' + escapeHtml(note) + "<\/p>";
                    })
                    .join("") +
                  "<\/div>";

              return (
                '<a class="endeavor-pillar reveal" href="' +
                getPageHref(pillar.slug) +
                '"><h3>' +
                escapeHtml(pillar.title) +
                '<\/h3><p class="endeavor-lead">' +
                escapeHtml(pillar.lead) +
                '<\/p>' +
                pillarBody +
                '<span class="endeavor-link">' +
                escapeHtml(pillar.cue || content.ui.openPage) +
                '<\/span><\/a>'
              );
            })
            .join("");
        }

        function renderHeader(content) {
          var languageOptions = [
            { value: "en", label: content.ui.languages.en },
            { value: "zh-Hans", label: content.ui.languages["zh-Hans"] }
          ];
          var navLabels = state.effectiveViewMode === "phone" && content.ui.navCompact
            ? content.ui.navCompact
            : content.ui.nav;
          var currentActive = state.page !== "home" ? ' aria-current="page"' : "";

          return (
            '<header class="site-header"><div class="container header-row"><a class="site-name" href="' +
            getHomeHref("#top") +
            '" aria-label="' +
            escapeHtml(content.meta.siteName) +
            '">' +
            renderBrandLockup(content) +
            '<\/a><div class="header-actions-shell"><div class="header-tools" aria-label="' +
            escapeHtml(content.ui.controlsLabel) +
            '">' +
            renderLanguageButtons(content.ui.languageLabel, languageOptions, state.language) +
            '<\/div><nav class="site-nav" aria-label="' +
            escapeHtml(content.ui.primaryNavLabel) +
            '"><a href="' +
            getHomeHref("#current") +
            '" data-nav-link="current"' +
            currentActive +
            ">" +
            escapeHtml(navLabels.current) +
            '<\/a><a href="' +
            getHomeHref("#icu") +
            '" data-nav-link="icu">' +
            escapeHtml(navLabels.icu) +
            '<\/a><a href="' +
            getHomeHref("#ltc") +
            '" data-nav-link="ltc">' +
            escapeHtml(navLabels.ltc) +
            '<\/a><a href="' +
            getHomeHref("#contact") +
            '" data-nav-link="contact">' +
            escapeHtml(navLabels.contact) +
            '<\/a><\/nav><\/div><\/div><\/header>'
          );
        }

        function renderHero(content) {
          var intro = getHeroIntro(content);

          return (
            '<section class="hero photo-backed" id="top"><div class="container"><div class="hero-stage reveal"><div class="hero-main"><div class="hero-identity" aria-hidden="true"><img src="logo-web.png?v=20260529" alt="" width="768" height="512" decoding="async" /><span>' +
            escapeHtml(getHeroIdentityText()) +
            '<\/span><\/div><span class="eyebrow">' +
            escapeHtml(content.hero.eyebrow) +
            '<\/span><h1>' +
            renderSelectiveAccent(content.hero.title) +
            '<\/h1><p class="hero-role">' +
            escapeHtml(content.hero.role) +
            '<\/p>' +
            (intro ? '<div class="hero-intro"><p>' + escapeHtml(intro) + '<\/p><\/div>' : "") +
            '<div class="hero-actions"><a class="button" href="' +
            escapeHtml(content.hero.actions[0].href) +
            '">' +
            escapeHtml(content.hero.actions[0].label) +
            '<\/a><a class="text-link" href="' +
            escapeHtml(content.hero.actions[1].href) +
            '">' +
            escapeHtml(content.hero.actions[1].label) +
            '<\/a><\/div><\/div><aside class="hero-aside" aria-label="' +
            escapeHtml(content.hero.portraitAriaLabel) +
            '"><div class="headshot-shell panel"><div class="headshot-stage" role="img" aria-label="' +
            escapeHtml(content.hero.portraitAriaLabel) +
            '"><\/div><\/div>' +
            renderHeroProfilePanels(content) +
            '<\/aside><div class="hero-evidence" aria-label="' +
            escapeHtml(getHeroCredentialsLabel()) +
            '">' +
            renderSignals(content.hero.signals) +
            '<\/div><\/div><\/div><\/section>'
          );
        }

        function renderCurrentSection(content) {
          return (
            '<section id="current"><div class="container current-layout"><div class="current-heading reveal"><span class="eyebrow">' +
            escapeHtml(content.current.eyebrow) +
            '<\/span><h2>' +
            renderSelectiveAccent(content.current.title) +
            '<\/h2><p>' +
            escapeHtml(content.current.summary) +
            '<\/p><\/div><div class="current-board"><article class="current-card current-card--pursuits panel reveal"><h3>' +
            escapeHtml(content.current.pursuits.title) +
            '<\/h3><p class="current-card-text">' +
            escapeHtml(content.current.pursuits.lead) +
            '<\/p>' +
            renderStackedLinks(content.current.pursuits.buttons) +
            '<\/article><div class="current-secondary"><article class="current-card current-card--presence panel reveal"><h3>' +
            escapeHtml(content.current.presence.title) +
            '<\/h3><p class="current-card-text">' +
            escapeHtml(content.current.presence.lead) +
            '<\/p>' +
            renderStackedLinks(content.current.presence.links) +
            '<\/article><article class="current-card current-card--learning panel reveal"><h3>' +
            escapeHtml(content.current.learning.title) +
            '<\/h3><p class="current-card-text">' +
            escapeHtml(content.current.learning.lead) +
            '<\/p>' +
            renderCurrentList(content.current.learning.items) +
            '<\/article><\/div><\/div><\/div><\/section>'
          );
        }

        function renderClinicalSection(sectionId, section) {
          return (
            '<section id="' +
            escapeHtml(sectionId) +
            '" class="photo-backed"><div class="container section-grid"><div class="section-heading reveal"><span class="eyebrow">' +
            escapeHtml(section.eyebrow) +
            '<\/span><h2>' +
            escapeHtml(section.title) +
            '<\/h2><p>' +
            escapeHtml(section.summary) +
            '<\/p><\/div><div class="section-content work-layout reveal"><div class="work-body panel">' +
            renderParagraphs(getSectionBody(section)) +
            '<\/div><aside class="work-details panel" aria-label="' +
            escapeHtml(section.detailsAriaLabel) +
            '"><div class="detail-list">' +
            renderDetailList(section.details) +
            '<\/div><\/aside><\/div><\/div><\/section>'
          );
        }

        function renderLtcSection(content) {
          return (
            '<section id="ltc" class="photo-backed"><div class="container section-grid"><div class="section-heading reveal"><span class="eyebrow">' +
            escapeHtml(content.ltc.eyebrow) +
            '<\/span><h2>' +
            escapeHtml(content.ltc.title) +
            '<\/h2><p>' +
            escapeHtml(content.ltc.summary) +
            '<\/p><\/div><div class="section-content section-stack"><div class="work-layout reveal"><div class="work-body panel">' +
            renderParagraphs(getSectionBody(content.ltc)) +
            '<\/div><aside class="work-details panel" aria-label="' +
            escapeHtml(content.ltc.detailsAriaLabel) +
            '"><div class="detail-list">' +
            renderDetailList(content.ltc.details) +
            '<\/div><\/aside><\/div><div class="section-subtitle reveal"><h3>' +
            escapeHtml(content.ltc.communityTitle) +
            '<\/h3><p>' +
            escapeHtml(content.ltc.communitySummary) +
            '<\/p><\/div><div class="work-body panel reveal">' +
            renderParagraphs(content.ltc.communityBody) +
            '<\/div><\/div><\/div><\/section>'
          );
        }

        function renderContactSection(content) {
          var contactEyebrow = content.contact.eyebrow
            ? '<span class="eyebrow">' + escapeHtml(content.contact.eyebrow) + '<\/span>'
            : "";

          return (
            '<section id="contact" class="photo-backed"><div class="container contact-grid"><div class="section-heading reveal">' +
            contactEyebrow +
            '<h2>' +
            escapeHtml(content.contact.title) +
            '<\/h2><p>' +
            escapeHtml(content.contact.summary) +
            '<\/p><\/div><div class="contact-card panel reveal"><p class="detail-label">' +
            escapeHtml(content.contact.location) +
            '<\/p><p>' +
            escapeHtml(content.contact.cardText) +
            '<\/p><div class="contact-actions"><a class="contact-mail" href="mailto:' +
            escapeHtml(content.contact.email) +
            '">' +
            escapeHtml(content.contact.email) +
            '<\/a><div class="closing-links" aria-label="' +
            escapeHtml(content.contact.chipsAriaLabel) +
            '">' +
            renderClosingLinks(content.contact.chips) +
            '<\/div><\/div><\/div><\/div><\/section>'
          );
        }

        function renderSubpage(content, slug) {
          var page = content.current.pages[slug];

          return (
            '<section class="subpage-view" id="top"><div class="container section-grid"><div class="section-heading reveal"><a class="subpage-back" href="' +
            getHomeHref("#current") +
            '">← ' +
            escapeHtml(content.ui.backToCurrent) +
            '<\/a><span class="eyebrow">' +
            escapeHtml(page.eyebrow) +
            '<\/span><h2>' +
            escapeHtml(page.title) +
            '<\/h2><p>' +
            escapeHtml(page.summary) +
            '<\/p><\/div><div class="section-content section-stack"><div class="subpage-layout reveal"><div class="work-body panel">' +
            renderParagraphs(page.body) +
            '<\/div><aside class="work-details panel" aria-label="' +
            escapeHtml(page.detailsAriaLabel) +
            '"><div class="detail-list">' +
            renderDetailList(page.details) +
            '<\/div><\/aside><\/div><div class="subpage-note panel reveal"><p>' +
            escapeHtml(page.note) +
            '<\/p><\/div><\/div><\/div><\/section>'
          );
        }

        function renderFooter(content) {
          return (
            '<footer class="footer"><div class="container footer-row"><p class="footer-summary">' +
            escapeHtml(content.footer.text) +
            '<\/p><p class="footer-note">' +
            escapeHtml(content.footer.copyright) +
            '<\/p><img class="footer-logo" src="footer-logo-light.png?v=20260530" alt="" width="768" height="512" loading="lazy" decoding="async" /><\/div><\/footer>'
          );
        }

        function renderMain(content) {
          if (state.page === "home") {
            return (
              renderHero(content) +
              renderCurrentSection(content) +
              renderClinicalSection("icu", content.icu) +
              renderLtcSection(content) +
              renderContactSection(content)
            );
          }

          return renderSubpage(content, state.page) + renderContactSection(content);
        }

        function renderApp(options) {
          var content = getContent();
          var shouldSyncHash = options && options.syncHash;
          state.effectiveViewMode = resolveAutoViewMode();
          state.page = getCurrentPage();

          updateRootState();
          setMeta(content);

          appRoot.innerHTML =
            '<a class="skip-link" href="#main-content">' +
            escapeHtml(content.ui.skipLink) +
            '<\/a><div class="page-shell">' +
            renderHeader(content) +
            '<main id="main-content">' +
            renderMain(content) +
            '<\/main>' +
            renderFooter(content) +
            '<\/div>';

          initRevealObserver();

          if (shouldSyncHash) {
            syncHash();
          }

          initCurrentSectionObserver();
        }

        function initRevealObserver() {
          var revealItems = document.querySelectorAll(".reveal");

          if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            revealItems.forEach(function (item) {
              item.classList.add("is-visible");
            });
            return;
          }

          var observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  observer.unobserve(entry.target);
                }
              });
            },
            {
              threshold: 0.14,
              rootMargin: "0px 0px -40px 0px"
            }
          );

          revealItems.forEach(function (item) {
            observer.observe(item);
          });
        }

        function initCurrentSectionObserver() {
          if (typeof teardownCurrentSectionObserver === "function") {
            teardownCurrentSectionObserver();
            teardownCurrentSectionObserver = null;
          }

          var links = Array.prototype.slice.call(document.querySelectorAll("[data-nav-link]"));

          if (state.page !== "home") {
            links.forEach(function (link) {
              if (link.getAttribute("data-nav-link") === "current") {
                link.setAttribute("aria-current", "page");
              } else {
                link.removeAttribute("aria-current");
              }
            });
            return;
          }

          var header = document.querySelector(".site-header");
          var hero = document.getElementById("top");
          var sections = ["current", "icu", "ltc", "contact"]
            .map(function (id) {
              return document.getElementById(id);
            })
            .filter(Boolean);

          if (!hero || !sections.length) {
            return;
          }

          var activeId = null;
          var ticking = false;

          function setActiveLink(nextId) {
            links.forEach(function (link) {
              if (nextId !== "top" && link.getAttribute("data-nav-link") === nextId) {
                link.setAttribute("aria-current", "page");
              } else {
                link.removeAttribute("aria-current");
              }
            });
          }

          function updateActiveSection() {
            ticking = false;

            var headerBottom = header ? Math.max(header.getBoundingClientRect().bottom, 0) : 0;
            var focusY = headerBottom + Math.min(window.innerHeight * 0.18, 120);
            var nextId = "top";
            var pageBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;

            sections.forEach(function (section) {
              if (section.getBoundingClientRect().top <= focusY) {
                nextId = section.id;
              }
            });

            if (pageBottom) {
              nextId = sections[sections.length - 1].id;
            }

            if (activeId === nextId) {
              return;
            }

            activeId = nextId;
            setActiveLink(nextId);
          }

          function requestUpdate() {
            if (ticking) {
              return;
            }

            ticking = true;
            window.requestAnimationFrame(updateActiveSection);
          }

          window.addEventListener("scroll", requestUpdate, { passive: true });
          window.addEventListener("resize", requestUpdate);
          requestUpdate();

          teardownCurrentSectionObserver = function () {
            window.removeEventListener("scroll", requestUpdate);
            window.removeEventListener("resize", requestUpdate);
          };
        }

        function syncHash() {
          if (state.page !== "home" || !window.location.hash) {
            return;
          }

          var target = document.querySelector(window.location.hash);

          if (!target) {
            return;
          }

          window.requestAnimationFrame(function () {
            target.scrollIntoView();
          });
        }

        function bindEvents() {
          document.addEventListener("click", function (event) {
            var button = event.target.closest("[data-set-lang]");

            if (!button) {
              return;
            }

            if (button.hasAttribute("data-set-lang")) {
              state.language = button.getAttribute("data-set-lang");
              writeStorage(STORAGE_KEYS.language, state.language);
            }

            renderApp();
          });

          window.addEventListener("resize", function () {
            if (resolveAutoViewMode() === state.effectiveViewMode) {
              return;
            }

            window.requestAnimationFrame(function () {
              renderApp();
            });
          });

          window.addEventListener("popstate", function () {
            renderApp();
          });
        }

        bindEvents();
        renderApp({ syncHash: true });
      })();
    </script>
  </body>
</html>
