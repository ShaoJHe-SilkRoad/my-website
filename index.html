<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shaoting He (Julius) | Clinical Dossier</title>

    <meta
      property="og:description"
      content="Quiet clinical dossier covering practice domains, clinical timeline, capability index, education and registration, language practice, technical systems work, and contact."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shaoting He (Julius)" />
    <meta property="og:url" content="https://shaotinghe.com/" />

    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shaoting He (Julius) | Clinical Dossier" />
    <meta
      name="twitter:description"
      content="A quiet clinical dossier for Shaoting He (Julius), RN."
    />
    <meta name="twitter:image" content="https://shaotinghe.com/og-image.png" />
    <link rel="canonical" href="https://shaotinghe.com/" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#101820" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index, follow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #eef1ef;
        --bg-2: #e3e9e8;
        --paper: #fafaf6;
        --paper-2: #f2f4f1;
        --ink: #101820;
        --ink-2: #1e2b33;
        --muted: #5b6a70;
        --muted-2: #7b8588;
        --line: rgba(16, 24, 32, 0.14);
        --line-strong: rgba(16, 24, 32, 0.26);
        --blue-black: #101820;
        --slate: #2c4853;
        --teal: #42696b;
        --champagne: #b7a16d;
        --champagne-soft: rgba(183, 161, 109, 0.12);
        --footer: #111f27;
        --white: #fbfaf7;
        --shadow: 0 26px 70px rgba(16, 24, 32, 0.12);
        --shadow-soft: 0 14px 34px rgba(16, 24, 32, 0.08);
        --container: 1180px;
        --header-offset: 5.05rem;
        --font-body: "Manrope", "Helvetica Neue", Arial, sans-serif;
        --font-display: "Newsreader", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: clip;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        overflow-x: clip;
        background:
          radial-gradient(circle at 18% 0%, rgba(66, 105, 107, 0.12), transparent 30rem),
          linear-gradient(180deg, var(--bg) 0%, var(--paper) 44%, var(--bg-2) 100%);
        color: var(--ink);
        font-family: var(--font-body);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(16, 24, 32, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16, 24, 32, 0.025) 1px, transparent 1px);
        background-size: 52px 52px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.75), transparent 76%);
      }

      img {
        display: block;
        max-width: 100%;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
      }

      :focus-visible {
        outline: 3px solid rgba(66, 105, 107, 0.55);
        outline-offset: 4px;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--ink);
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.74;
      }

      ul,
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .skip-link {
        position: fixed;
        top: -4rem;
        left: 1rem;
        z-index: 100;
        padding: 0.76rem 1rem;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        font-weight: 700;
        transition: top 160ms ease;
      }

      .skip-link:focus {
        top: 1rem;
      }

      .container {
        width: min(calc(100% - 2rem), var(--container));
        max-width: 100%;
        margin: 0 auto;
      }

      .page-shell {
        min-height: 100vh;
        padding-top: var(--header-offset);
      }

      .site-header {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 80;
        border-bottom: 1px solid rgba(16, 24, 32, 0.11);
        background: rgba(238, 241, 239, 0.94);
        backdrop-filter: blur(16px);
      }

      .header-row {
        display: grid;
        grid-template-columns: minmax(13rem, 1fr) auto;
        gap: 1rem;
        align-items: center;
        min-height: var(--header-offset);
      }

      .site-name {
        display: grid;
        gap: 0.12rem;
        width: max-content;
        max-width: 100%;
      }

      .wordmark {
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 1.28rem;
        font-weight: 700;
        line-height: 1;
      }

      .wordmark-meta {
        color: var(--muted);
        font-size: 0.69rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .header-actions {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        justify-content: end;
        min-width: 0;
        max-width: 100%;
      }

      .language-control {
        display: inline-flex;
        gap: 0.18rem;
        flex: 0 0 auto;
        padding: 0.18rem;
        border: 1px solid rgba(16, 24, 32, 0.13);
        border-radius: 999px;
        background: rgba(250, 250, 246, 0.62);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.44);
      }

      .language-control button {
        min-width: 2.55rem;
        min-height: 2.22rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.77rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .language-control button[aria-pressed="true"] {
        background: var(--white);
        color: var(--ink);
        box-shadow: 0 4px 12px rgba(16, 24, 32, 0.1);
      }

      .site-nav {
        display: flex;
        flex: 1 1 auto;
        gap: 0.08rem;
        align-items: center;
        justify-content: end;
        min-width: 0;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .site-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 2.35rem;
        padding: 0.52rem 0.74rem;
        border-radius: 999px;
        color: var(--ink-2);
        font-size: 0.78rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible,
      .site-nav a[aria-current="page"] {
        background: rgba(16, 24, 32, 0.07);
        color: var(--ink);
      }

      main section {
        position: relative;
        scroll-margin-top: calc(var(--header-offset) + 1.35rem);
      }

      .section {
        padding: clamp(4.5rem, 8vw, 7.4rem) 0;
        border-top: 1px solid var(--line);
      }

      .section-heading {
        display: grid;
        grid-template-columns: minmax(0, 0.86fr) minmax(18rem, 1.14fr);
        gap: clamp(2rem, 5vw, 4.8rem);
        align-items: start;
        margin-bottom: clamp(2.2rem, 5vw, 4rem);
      }

      .section-heading > * {
        min-width: 0;
      }

      .section-heading h2 {
        max-width: min(13ch, 100%);
        font-size: clamp(2.75rem, 6vw, 5.45rem);
        line-height: 0.9;
        overflow-wrap: normal;
        text-wrap: balance;
      }

      .section-heading p {
        max-width: min(46rem, 100%);
        padding-top: 0.25rem;
        font-size: clamp(1.02rem, 1.35vw, 1.18rem);
      }

      .eyebrow {
        display: inline-flex;
        gap: 0.58rem;
        align-items: center;
        color: var(--slate);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 2.1rem;
        height: 1px;
        background: var(--champagne);
      }

      .button,
      .text-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.82rem 1.16rem;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        font-size: 0.92rem;
        font-weight: 800;
      }

      .button {
        background: var(--blue-black);
        border-color: var(--blue-black);
        color: var(--white);
      }

      .text-link {
        background: rgba(250, 250, 246, 0.52);
        color: var(--ink);
      }

      .hero {
        padding: clamp(3.4rem, 6vw, 6rem) 0 clamp(4.8rem, 8vw, 7rem);
      }

      .hero-frame {
        display: grid;
        grid-template-columns: minmax(0, 1.04fr) minmax(18rem, 0.74fr);
        gap: clamp(2rem, 5vw, 4.8rem);
        align-items: stretch;
      }

      .hero-copy {
        display: grid;
        align-content: center;
        gap: 1.45rem;
        min-height: clamp(36rem, 63vw, 46rem);
        padding: clamp(2.2rem, 4vw, 3.6rem);
        border: 1px solid var(--line);
        background:
          linear-gradient(135deg, rgba(250, 250, 246, 0.94), rgba(241, 245, 242, 0.86)),
          var(--paper);
        box-shadow: var(--shadow);
      }

      .hero h1 {
        max-width: 10.5ch;
        font-size: clamp(4rem, 10vw, 8.8rem);
        line-height: 0.82;
      }

      .hero-role {
        max-width: 43rem;
        color: var(--ink-2);
        font-family: var(--font-display);
        font-size: clamp(1.45rem, 2.5vw, 2.3rem);
        line-height: 1.12;
      }

      .hero-intro {
        max-width: 43rem;
        font-size: clamp(1.02rem, 1.35vw, 1.18rem);
      }

      .hero-actions,
      .contact-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }

      .identity-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--line);
      }

      .identity-item {
        display: grid;
        gap: 0.32rem;
        min-height: 8.4rem;
        padding: 1rem;
        background: rgba(250, 250, 246, 0.75);
      }

      .label {
        color: var(--slate);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .identity-item p,
      .index-line p,
      .timeline-item p,
      .education-row p,
      .language-row p {
        color: var(--ink-2);
        font-size: 0.94rem;
        line-height: 1.55;
      }

      .hero-visual {
        display: grid;
        grid-template-rows: minmax(24rem, 1fr) auto;
        gap: 1rem;
        min-width: 0;
      }

      .portrait-panel {
        position: relative;
        overflow: hidden;
        min-height: 34rem;
        border: 1px solid rgba(16, 24, 32, 0.17);
        background:
          linear-gradient(180deg, rgba(16, 24, 32, 0.05), rgba(16, 24, 32, 0.2)),
          #dce4e2;
        box-shadow: var(--shadow-soft);
      }

      .portrait-panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("portrait-side-profile-web.jpg");
        background-size: cover;
        background-position: center top;
        filter: saturate(0.82) contrast(1.03);
      }

      .portrait-caption {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        left: 1rem;
        display: grid;
        gap: 0.25rem;
        padding: 0.95rem 1rem;
        background: rgba(17, 31, 39, 0.86);
        color: var(--white);
      }

      .portrait-caption span {
        color: rgba(251, 250, 247, 0.62);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .portrait-caption strong {
        font-family: var(--font-display);
        font-size: 1.35rem;
        line-height: 1;
      }

      .dossier-note {
        padding: 1.2rem 1.25rem;
        border-left: 3px solid var(--champagne);
        background: rgba(16, 24, 32, 0.04);
      }

      .domain-list {
        display: grid;
        border-top: 1px solid var(--line-strong);
      }

      .domain-row {
        display: grid;
        grid-template-columns: 4.8rem minmax(0, 0.64fr) minmax(16rem, 1.1fr);
        gap: clamp(1rem, 3vw, 3rem);
        padding: clamp(1.4rem, 3.5vw, 2.5rem) 0;
        border-bottom: 1px solid var(--line);
      }

      .domain-number {
        color: var(--champagne);
        font-family: var(--font-display);
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        line-height: 0.9;
      }

      .domain-row h3,
      .timeline-item h3,
      .systems-feature h3 {
        font-size: clamp(1.45rem, 2.5vw, 2.1rem);
        line-height: 1;
      }

      .domain-row p {
        max-width: 48rem;
      }

      .detail-text {
        display: block;
        margin-top: 0.75rem;
        color: var(--ink-2);
        font-size: 0.94rem;
        font-weight: 700;
        line-height: 1.55;
      }

      .timeline {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(18rem, 1.1fr);
        gap: clamp(2rem, 5vw, 4.2rem);
      }

      .timeline-rail {
        display: grid;
        gap: 0;
        border-top: 1px solid var(--line-strong);
      }

      .timeline-item {
        display: grid;
        grid-template-columns: minmax(7rem, 0.28fr) minmax(0, 1fr);
        gap: 1.4rem;
        padding: 1.35rem 0;
        border-bottom: 1px solid var(--line);
      }

      .timeline-meta {
        color: var(--slate);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .timeline-aside {
        align-self: start;
        padding: clamp(1.4rem, 3vw, 2rem);
        border: 1px solid var(--line);
        background: rgba(250, 250, 246, 0.66);
        box-shadow: var(--shadow-soft);
      }

      .timeline-aside p {
        color: var(--ink-2);
        font-family: var(--font-display);
        font-size: clamp(1.35rem, 2.5vw, 2rem);
        line-height: 1.15;
      }

      .index-table {
        display: grid;
        border-top: 1px solid var(--line-strong);
      }

      .index-line {
        display: grid;
        grid-template-columns: minmax(11rem, 0.45fr) minmax(0, 1fr);
        gap: clamp(1rem, 3vw, 3.2rem);
        padding: 1.25rem 0;
        border-bottom: 1px solid var(--line);
      }

      .education-grid,
      .language-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--line);
      }

      .education-row,
      .language-row {
        display: grid;
        gap: 0.55rem;
        min-height: 11rem;
        padding: clamp(1.1rem, 3vw, 1.7rem);
        background: rgba(250, 250, 246, 0.74);
      }

      .education-row h3,
      .language-row h3 {
        font-size: clamp(1.28rem, 2.3vw, 1.75rem);
      }

      .systems-layout {
        display: grid;
        grid-template-columns: minmax(0, 0.85fr) minmax(18rem, 1.15fr);
        gap: clamp(2rem, 5vw, 4rem);
        align-items: start;
      }

      .systems-feature {
        display: grid;
        gap: 1rem;
        padding: clamp(1.4rem, 3vw, 2rem);
        border-top: 4px solid var(--slate);
        background: rgba(250, 250, 246, 0.62);
        box-shadow: var(--shadow-soft);
      }

      .systems-links {
        display: grid;
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--line);
      }

      .systems-link {
        display: grid;
        gap: 0.35rem;
        padding: 1.15rem 1.25rem;
        background: rgba(250, 250, 246, 0.78);
      }

      .systems-link strong {
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 1.35rem;
      }

      .systems-link span {
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.55;
      }

      .contact-section {
        background: var(--footer);
        color: var(--white);
      }

      .contact-section .section-heading h2,
      .contact-section .section-heading p,
      .contact-section .eyebrow,
      .contact-section .contact-panel p,
      .contact-section .label {
        color: var(--white);
      }

      .contact-section .eyebrow::before {
        background: rgba(251, 250, 247, 0.44);
      }

      .contact-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.8fr) minmax(18rem, 1.2fr);
        gap: clamp(2rem, 5vw, 4rem);
        align-items: start;
      }

      .contact-section .contact-grid > .section-heading {
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-bottom: 0;
      }

      .contact-section .section-heading p {
        max-width: 34rem;
        padding-top: 0;
      }

      .contact-panel {
        display: grid;
        gap: 1.1rem;
        padding: clamp(1.5rem, 3vw, 2.4rem);
        border: 1px solid rgba(251, 250, 247, 0.16);
        background: rgba(251, 250, 247, 0.055);
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.18);
      }

      .contact-mail {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
        padding: 0.82rem 1.08rem;
        border: 1px solid rgba(251, 250, 247, 0.22);
        border-radius: 999px;
        color: var(--white);
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .contact-note {
        color: rgba(251, 250, 247, 0.7);
        font-size: 0.9rem;
      }

      .site-footer {
        border-top: 1px solid rgba(251, 250, 247, 0.13);
        background: var(--footer);
        color: var(--white);
      }

      .footer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1rem;
        align-items: center;
        min-height: 7.2rem;
        padding: 1.35rem 0 1.9rem;
      }

      .footer-summary {
        max-width: 42rem;
        color: rgba(251, 250, 247, 0.86);
        font-weight: 700;
      }

      .footer-note {
        grid-column: 1 / -1;
        justify-self: center;
        max-width: min(31rem, 90vw);
        color: rgba(251, 250, 247, 0.5);
        font-size: 0.58rem;
        line-height: 1.45;
        text-align: center;
      }

      .footer-logo {
        width: clamp(5.8rem, 8vw, 8rem);
        height: auto;
        opacity: 0.88;
      }

      .reveal {
        opacity: 0;
        transform: translateY(14px);
        transition:
          opacity 420ms ease,
          transform 420ms ease;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        :root {
          --header-offset: 7rem;
        }

        .header-row {
          grid-template-columns: 1fr;
          gap: 0.55rem;
          align-content: center;
          padding: 0.6rem 0;
        }

        .header-actions {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          justify-content: start;
          width: 100%;
          min-width: 0;
          overflow: hidden;
        }

        .site-nav {
          justify-content: start;
          width: 100%;
          min-width: 0;
          max-width: 100%;
          overflow-x: auto;
          overflow-y: hidden;
          scrollbar-width: none;
        }

        .site-nav::-webkit-scrollbar {
          display: none;
        }

        .hero-frame,
        .section-heading,
        .timeline,
        .systems-layout,
        .contact-grid {
          grid-template-columns: 1fr;
        }

        .hero-copy {
          min-height: auto;
        }

        .identity-strip,
        .education-grid,
        .language-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .domain-row {
          grid-template-columns: 3.6rem 1fr;
        }

        .domain-row p {
          grid-column: 2;
        }
      }

      @media (max-width: 620px) {
        :root {
          --header-offset: 10.25rem;
        }

        .container {
          width: min(calc(100% - 1rem), var(--container));
        }

        .wordmark {
          font-size: 1.1rem;
        }

        .language-control button,
        .site-nav a {
          min-height: 2.08rem;
          padding: 0.42rem 0.58rem;
          font-size: 0.72rem;
        }

        .language-control button {
          min-width: 3.05rem;
        }

        .header-actions {
          grid-template-columns: 1fr;
          gap: 0.45rem;
          overflow: visible;

          var nav = content.ui.nav
            .map(function (item) {
              return '<a href="#' + escapeHtml(item[0]) + '" data-nav-link="' + escapeHtml(item[0]) + '">' + escapeHtml(item[1]) + "</a>";
            })
            .join("");

          return (
            '<header class="site-header"><div class="container header-row"><a class="site-name" href="#top" aria-label="' +
            escapeHtml(content.meta.siteName) +
            '"><span class="wordmark">' +
            escapeHtml(content.meta.siteName) +
            '</span><span class="wordmark-meta">' +
            escapeHtml(content.meta.role) +
            '</span></a><div class="header-actions"><div class="language-control" role="group" aria-label="' +
            escapeHtml(content.ui.language) +
            '">' +
            languageOptions +
            '</div><nav class="site-nav" aria-label="' +
            escapeHtml(content.ui.navLabel) +
            '">' +
            nav +
            "</nav></div></div></header>"
          );
        }

        function renderHero(content) {
          return (
            '<section class="hero" id="top"><div class="container hero-frame"><div class="hero-copy reveal"><span class="eyebrow">' +
            escapeHtml(content.hero.eyebrow) +
            '</span><h1>' +
            escapeHtml(content.hero.title) +
            (content.hero.titleTail ? '<br /><span>' + escapeHtml(content.hero.titleTail) + "</span>" : "") +
            '</h1><p class="hero-role">' +
            escapeHtml(content.hero.role) +
            '</p><p class="hero-intro">' +
            escapeHtml(content.hero.intro) +
            '</p><div class="hero-actions">' +
            renderActions(content.hero.actions) +
            '</div><div class="identity-strip">' +
            renderIdentity(content.hero.identity) +
            '</div></div><aside class="hero-visual reveal" aria-label="' +
            escapeHtml(content.hero.portraitLabel) +
            '"><div class="portrait-panel" role="img" aria-label="' +
            escapeHtml(content.hero.portraitLabel) +
            '"><div class="portrait-caption"><span>' +
            escapeHtml(content.hero.portraitLabel) +
            '</span><strong>' +
            escapeHtml(content.hero.portraitText) +
            '</strong></div></div><div class="dossier-note"><p>' +
            escapeHtml(content.sections.timeline.aside) +
            "</p></div></aside></div></section>"
          );
        }

        function renderActions(actions) {
          return actions
            .map(function (action, index) {
              return '<a class="' + (index === 0 ? "button" : "text-link") + '" href="' + escapeHtml(action[0]) + '">' + escapeHtml(action[1]) + "</a>";
            })
            .join("");
        }

        function renderIdentity(items) {
          return items
            .map(function (item) {
              return '<div class="identity-item"><span class="label">' + escapeHtml(item[0]) + "</span><p>" + escapeHtml(item[1]) + "</p></div>";
            })
            .join("");
        }

        function renderSectionHeading(section) {
          return (
            '<div class="section-heading reveal"><div><span class="eyebrow">' +
            escapeHtml(section.eyebrow) +
            '</span><h2>' +
            escapeHtml(section.title) +
            '</h2></div><p>' +
            escapeHtml(section.summary) +
            "</p></div>"
          );
        }

        function renderPractice(section) {
          return (
            '<section class="section" id="practice">' +
            '<div class="container">' +
            renderSectionHeading(section) +
            '<div class="domain-list">' +
            section.items
              .map(function (item, index) {
                return (
                  '<article class="domain-row reveal"><span class="domain-number">' +
                  String(index + 1).padStart(2, "0") +
                  '</span><h3>' +
                  escapeHtml(item.title) +
                  '</h3><p>' +
                  escapeHtml(item.text) +
                  '<span class="detail-text">' +
                  escapeHtml(item.detail) +
                  "</span></p></article>"
                );
              })
              .join("") +
            "</div></div></section>"
          );
        }

        function renderTimeline(section) {
          return (
            '<section class="section" id="timeline"><div class="container">' +
            renderSectionHeading(section) +
            '<div class="timeline"><div class="timeline-rail">' +
            section.items
              .map(function (item) {
                return (
                  '<article class="timeline-item reveal"><span class="timeline-meta">' +
                  escapeHtml(item[0]) +
                  '</span><div><h3>' +
                  escapeHtml(item[1]) +
                  '</h3><p>' +
                  escapeHtml(item[2]) +
                  "</p></div></article>"
                );
              })
              .join("") +
            '</div><aside class="timeline-aside reveal"><p>' +
            escapeHtml(section.aside) +
            "</p></aside></div></div></section>"
          );
        }

        function renderIndex(section) {
          return (
            '<section class="section" id="capability"><div class="container">' +
            renderSectionHeading(section) +
            '<div class="index-table">' +
            section.items
              .map(function (item) {
                return '<div class="index-line reveal"><span class="label">' + escapeHtml(item[0]) + "</span><p>" + escapeHtml(item[1]) + "</p></div>";
              })
              .join("") +
            "</div></div></section>"
          );
        }

        function renderGridSection(id, section, className) {
          return (
            '<section class="section" id="' +
            escapeHtml(id) +
            '"><div class="container">' +
            renderSectionHeading(section) +
            '<div class="' +
            escapeHtml(className) +
            '">' +
            section.items
              .map(function (item) {
                return '<article class="' + (className === "education-grid" ? "education-row" : "language-row") + ' reveal"><span class="label">' + escapeHtml(item[0]) + "</span><p>" + escapeHtml(item[1]) + "</p></article>";
              })
              .join("") +
            "</div></div></section>"
          );
        }

        function renderSystems(section) {
          return (
            '<section class="section" id="systems"><div class="container">' +
            renderSectionHeading(section) +
            '<div class="systems-layout"><article class="systems-feature reveal"><span class="label">' +
            escapeHtml(section.featureTitle) +
            '</span><h3>' +
            escapeHtml(section.title) +
            '</h3><p>' +
            escapeHtml(section.feature) +
            '</p></article><div class="systems-links">' +
            section.links
              .map(function (link) {
                return '<a class="systems-link reveal" href="' + escapeHtml(link[0]) + '"><strong>' + escapeHtml(link[1]) + "</strong><span>" + escapeHtml(link[2]) + "</span></a>";
              })
              .join("") +
            "</div></div></div></section>"
          );
        }

        function renderContact(section) {
          return (
            '<section class="section contact-section" id="contact"><div class="container contact-grid"><div class="section-heading reveal"><div><span class="eyebrow">' +
            escapeHtml(section.eyebrow) +
            '</span><h2>' +
            escapeHtml(section.title) +
            '</h2></div><p>' +
            escapeHtml(section.summary) +
            '</p></div><article class="contact-panel reveal"><span class="label">' +
            escapeHtml(section.location) +
            '</span><p>' +
            escapeHtml(section.text) +
            '</p><div class="contact-actions"><a class="contact-mail" href="mailto:' +
            escapeHtml(section.email) +
            '">' +
            escapeHtml(section.email) +
            '</a></div><p class="contact-note">' +
            escapeHtml(section.note) +
            "</p></article></div></section>"
          );
        }

        function renderFooter(content) {
          return (
            '<footer class="site-footer"><div class="container footer-row"><p class="footer-summary">' +
            escapeHtml(content.footer.text) +
            '</p><img class="footer-logo" src="footer-logo-light.png?v=20260530" alt="" width="768" height="512" loading="lazy" decoding="async" /><p class="footer-note">' +
            escapeHtml(content.footer.copyright) +
            "</p></div></footer>"
          );
        }

        function render() {
          var content = CONTENT[state.language] || CONTENT.en;
          var hash = window.location.hash;
          setMeta(content);

          app.innerHTML =
            '<a class="skip-link" href="#main-content">' +
            escapeHtml(content.ui.skip) +
            '</a><div class="page-shell">' +
            renderHeader(content) +
            '<main id="main-content">' +
            renderHero(content) +
            renderPractice(content.sections.practice) +
            renderTimeline(content.sections.timeline) +
            renderIndex(content.sections.capability) +
            renderGridSection("education", content.sections.education, "education-grid") +
            renderGridSection("language", content.sections.language, "language-grid") +
            renderSystems(content.sections.systems) +
            renderContact(content.sections.contact) +
            "</main>" +
            renderFooter(content) +
            "</div>";

          initReveal();
          initActiveNav();

          if (hash && document.querySelector(hash)) {
            window.requestAnimationFrame(function () {
              document.querySelector(hash).scrollIntoView();
            });
          }
        }

        function initReveal() {
          var items = Array.prototype.slice.call(document.querySelectorAll(".reveal"));

          if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            items.forEach(function (item) {
              item.classList.add("is-visible");
            });
            return;
          }

          var observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.12, rootMargin: "0px 0px -40px 0px" }
          );

          items.forEach(function (item) {
            observer.observe(item);
          });
        }

        function initActiveNav() {
          if (typeof teardownActiveNav === "function") {
            teardownActiveNav();
          }

          var links = Array.prototype.slice.call(document.querySelectorAll("[data-nav-link]"));
          var sections = links
            .map(function (link) {
              return document.getElementById(link.getAttribute("data-nav-link"));
            })
            .filter(Boolean);
          var activeId = null;
          var ticking = false;

          function update() {
            ticking = false;
            var header = document.querySelector(".site-header");
            var focusY = (header ? Math.max(header.getBoundingClientRect().bottom, 0) : 0) + Math.min(window.innerHeight * 0.18, 120);
            var nextId = "";
            var atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;

            sections.forEach(function (section) {
              if (section.getBoundingClientRect().top <= focusY) {
                nextId = section.id;
              }
            });

            if (atBottom && sections.length) {
              nextId = sections[sections.length - 1].id;
            }

            if (activeId === nextId) {
              return;
            }

            activeId = nextId;
            links.forEach(function (link) {
              if (link.getAttribute("data-nav-link") === nextId) {
                link.setAttribute("aria-current", "page");
              } else {
                link.removeAttribute("aria-current");
              }
            });
          }

          function requestUpdate() {
            if (ticking) {
              return;
            }
            ticking = true;
            window.requestAnimationFrame(update);
          }

          window.addEventListener("scroll", requestUpdate, { passive: true });
          window.addEventListener("resize", requestUpdate);
          window.addEventListener("hashchange", requestUpdate);
          requestUpdate();

          teardownActiveNav = function () {
            window.removeEventListener("scroll", requestUpdate);
            window.removeEventListener("resize", requestUpdate);
            window.removeEventListener("hashchange", requestUpdate);
          };
        }

        document.addEventListener("click", function (event) {
          var button = event.target.closest("[data-language]");
          if (!button) {
            return;
          }

          state.language = button.getAttribute("data-language");
          storeLanguage(state.language);
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
