    <style>
      /* Design Tokens */
      :root {
        --bg: #f7fbf9;
        --bg-soft: #e7f0ed;
        --bg-support: #f4f1ea;
        --surface: rgba(255, 255, 255, 0.84);
        --surface-strong: rgba(255, 255, 255, 0.94);
        --text: #102127;
        --heading: #102a33;
        --muted: #345158;
        --accent: #173d47;
        --accent-strong: #102a33;
        --accent-soft: #2c5a63;
        --sage: #8fafa6;
        --line: rgba(16, 42, 51, 0.12);
        --line-strong: rgba(16, 42, 51, 0.22);
        --shadow: 0 24px 60px rgba(16, 42, 51, 0.08);
        --shadow-soft: 0 16px 34px rgba(16, 42, 51, 0.05);
        --container: 1180px;
        --measure: 44rem;
        --radius: 1.15rem;
        --font-body: "Manrope", "Helvetica Neue", Arial, sans-serif;
        --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
        --section-space: clamp(4rem, 8vw, 7rem);
        --hero-surface: rgba(255, 255, 255, 0.92);
        --hero-line: rgba(16, 42, 51, 0.12);
        --hero-accent: #173d47;
        --icu-bg: #f5f1eb;
        --icu-surface: rgba(255, 250, 244, 0.88);
        --icu-surface-soft: rgba(255, 248, 242, 0.72);
        --icu-line: rgba(122, 91, 73, 0.16);
        --icu-accent: #7a5b49;
        --ltc-bg: #f0f7f2;
        --ltc-surface: rgba(249, 252, 250, 0.88);
        --ltc-surface-soft: rgba(249, 252, 250, 0.74);
        --ltc-line: rgba(94, 128, 109, 0.16);
        --ltc-accent: #5e806d;
        --contact-bg: #122f38;
        --contact-surface: rgba(255, 255, 255, 0.05);
        --contact-line: rgba(234, 243, 240, 0.14);
        --contact-text: #eef4f2;
        --contact-chip: #c7af7a;
        --portrait-image: url("portrait-side-profile.png");
        --hero-photo: none;
        --icu-photo: none;
        --ltc-photo: none;
        --contact-photo: none;
        --hero-photo-opacity: 0;
        --icu-photo-opacity: 0;
        --ltc-photo-opacity: 0;
        --contact-photo-opacity: 0;
      }

      /* Base */
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(143, 175, 166, 0.12), transparent 24%),
          linear-gradient(180deg, var(--bg) 0%, #f2f8f6 42%, var(--bg-soft) 100%);
        color: var(--text);
        font-family: var(--font-body);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        transition: background-color 320ms ease;
      }

      img {
        display: block;
        max-width: 100%;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.74;
      }

      p + p {
        margin-top: 1rem;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--heading);
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      .name-accent {
        color: #4a7084;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      :focus-visible {
        outline: 3px solid var(--accent-soft);
        outline-offset: 4px;
      }

      .skip-link {
        position: absolute;
        top: -3rem;
        left: 1rem;
        z-index: 50;
        padding: 0.8rem 1rem;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--surface-strong);
        color: var(--heading);
        transition: top 180ms ease;
      }

      .skip-link:focus {
        top: 1rem;
      }

      /* Layout */
      .page-shell {
        min-height: 100vh;
        position: relative;
        isolation: isolate;
      }

      .container {
        width: min(calc(100% - 2rem), var(--container));
        margin: 0 auto;
      }

      .site-header {
        --header-height-expanded: 10.5rem;
        --header-height-compact: 6.75rem;
        --header-current-height: var(--header-height-expanded);
        --logo-height-ratio: 0.66;
        position: sticky;
        top: 0;
        z-index: 20;
        will-change: transform;
        backdrop-filter: blur(16px);
        background: rgba(231, 240, 237, 0.9);
        border-bottom: 1px solid var(--line);
        transition:
          transform 220ms ease,
          opacity 220ms ease,
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .site-header.is-compact {
        --header-current-height: var(--header-height-compact);
      }

      .site-header.is-hidden {
        transform: translateY(calc(-100% - 0.24rem));
      }

      .header-row {
        display: grid;
        gap: 0.7rem;
        align-items: stretch;
        min-height: var(--header-current-height);
        padding: 0.78rem 0;
        transition:
          min-height 180ms ease,
          padding 180ms ease,
          gap 180ms ease;
      }

      .header-actions-shell {
        display: grid;
        gap: 0.7rem;
        min-width: 0;
        align-self: center;
        transition: gap 180ms ease;
      }

      .header-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        align-items: flex-start;
      }

      .control-group {
        display: grid;
        gap: 0.35rem;
      }

      .control-label {
        color: var(--accent);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .segmented-control {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.22rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(12px);
      }

      .control-button {
        min-height: 2.4rem;
        padding: 0.55rem 0.78rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 180ms ease,
          color 180ms ease,
          transform 180ms ease;
      }

      .control-button:hover,
      .control-button:focus-visible,
      .control-button.is-active {
        color: var(--heading);
        background: rgba(23, 61, 71, 0.12);
      }

      .site-name {
        display: flex;
        align-self: stretch;
        align-items: center;
        min-height: 0;
        color: var(--accent-strong);
        line-height: 1;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        height: 100%;
        min-height: 0;
        min-width: 0;
      }

      .brand-mark {
        display: flex;
        align-items: center;
        width: auto;
        height: calc(var(--header-current-height) * var(--logo-height-ratio));
        flex: 0 0 auto;
        overflow: visible;
        transition: height 180ms ease;
      }

      .brand-logo {
        display: block;
        width: auto;
        height: 100%;
        max-height: none;
        object-fit: contain;
      }

      .brand-wordmark {
        display: grid;
        align-content: center;
        gap: 0.08rem;
        min-width: 0;
      }

      .brand-name {
        color: var(--accent-strong);
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        line-height: 1.1;
        white-space: nowrap;
      }

      .brand-name--short {
        display: none;
      }

      .brand-support {
        color: var(--muted);
        font-size: 0.64rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        line-height: 1.1;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .site-nav {
        display: flex;
        gap: 0.6rem;
        overflow-x: auto;
        padding-bottom: 0.1rem;
        scrollbar-width: none;
      }

      .site-nav::-webkit-scrollbar {
        display: none;
      }

      .site-nav a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        border-radius: 999px;
        padding: 0.5rem 0.8rem;
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 600;
        white-space: nowrap;
        transition:
          color 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .site-nav a:hover,
      .site-nav a:focus-visible,
      .site-nav a[aria-current="page"] {
        color: var(--heading);
        background: rgba(23, 61, 71, 0.08);
      }

      .site-header.is-compact .header-row {
        gap: 0.56rem;
        padding: 0.52rem 0;
      }

      .site-header.is-compact .header-actions-shell {
        gap: 0.52rem;
      }

      main section {
        padding: var(--section-space) 0;
        border-top: 1px solid var(--line);
        position: relative;
        overflow: clip;
        isolation: isolate;
        scroll-margin-top: 7rem;
      }

      main section:first-child {
        border-top: 0;
      }

      .section-grid,
      .contact-grid {
        display: grid;
        gap: 2rem;
      }

      .section-heading {
        display: grid;
        gap: 0.9rem;
        align-content: start;
      }

      .section-heading h2 {
        max-width: 10ch;
        font-size: clamp(2.4rem, 5vw, 4.5rem);
        line-height: 0.95;
      }

      .section-heading p {
        max-width: 32rem;
      }

      .section-content {
        min-width: 0;
      }

      .section-content > p {
        max-width: var(--measure);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        color: var(--accent);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 2.5rem;
        height: 1px;
        background: currentColor;
        opacity: 0.42;
      }

      /* Components */
      .panel {
        border: 1px solid var(--panel-line, var(--line));
        border-radius: var(--radius);
        background: var(
          --panel-surface,
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.82))
        );
        box-shadow: var(--panel-shadow, var(--shadow));
        backdrop-filter: blur(18px) saturate(1.04);
      }

      .button,
      .text-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.85rem 1.3rem;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        font-size: 0.94rem;
        font-weight: 600;
        transition:
          transform 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease;
      }

      .button {
        background: var(--accent);
        border-color: var(--accent);
        color: #eaf3f0;
      }

      .button:hover,
      .button:focus-visible {
        transform: translateY(-2px);
        background: var(--accent-strong);
        box-shadow: 0 18px 34px rgba(23, 61, 71, 0.18);
      }

      .text-link {
        background: rgba(23, 61, 71, 0.04);
        color: var(--heading);
      }

      .text-link:hover,
      .text-link:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(23, 61, 71, 0.28);
        background: rgba(23, 61, 71, 0.08);
      }

      .detail-list {
        display: grid;
        gap: 0.95rem;
      }

      .detail-item {
        display: grid;
        gap: 0.35rem;
      }

      .detail-label,
      .status-label,
      .proof-label,
      .signal-label {
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .detail-item p,
      .signal-text {
        color: var(--heading);
        font-size: 0.96rem;
        line-height: 1.62;
      }

      .signal-text {
        display: grid;
        gap: 0.18rem;
      }

      .signal-text strong {
        font-weight: 700;
        color: inherit;
      }

      .signal-line {
        display: block;
      }

      /* Hero */
      .hero {
        padding-top: clamp(1.4rem, 3vw, 2.3rem);
      }

      .hero-stage {
        display: grid;
        gap: 1.5rem;
        align-items: start;
        min-height: clamp(28rem, 68vh, 35rem);
        padding: clamp(1.4rem, 3.2vw, 2.4rem);
        border: 1px solid var(--line);
        border-radius: calc(var(--radius) + 0.15rem);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(244, 249, 247, 0.92)),
          linear-gradient(135deg, rgba(143, 175, 166, 0.06), transparent);
        box-shadow: 0 22px 48px rgba(16, 42, 51, 0.08);
        backdrop-filter: blur(22px) saturate(1.04);
      }

      .hero-main {
        display: grid;
        gap: 1rem;
        align-content: start;
        max-width: 100%;
      }

      .hero-main h1 {
        max-width: 8.6ch;
        font-size: clamp(3.1rem, 8.4vw, 5.1rem);
        line-height: 0.92;
      }

      .hero-role {
        max-width: 36rem;
        color: var(--heading);
        font-size: clamp(1.16rem, 2.1vw, 1.5rem);
        font-weight: 600;
        line-height: 1.45;
      }

      .hero-intro {
        max-width: 38rem;
      }

      .hero-intro p:first-child {
        color: var(--muted);
      }

      .hero-evidence {
        margin-top: 0.2rem;
      }

      .signal-list {
        display: grid;
        gap: 0.75rem;
      }

      .signal-item {
        display: grid;
        gap: 0.4rem;
        padding: 0.95rem 1rem;
        border: 1px solid rgba(23, 61, 71, 0.12);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: var(--shadow-soft);
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-top: 0.2rem;
      }

      .hero-aside {
        display: grid;
        gap: 1rem;
        align-content: start;
      }

      .headshot-shell {
        padding: 0.8rem;
        background: linear-gradient(180deg, rgba(16, 42, 51, 0.04), rgba(16, 42, 51, 0.02)), var(--surface-strong);
      }

      .headshot-stage {
        position: relative;
        aspect-ratio: 4 / 5;
        width: 100%;
        overflow: hidden;
        border-radius: calc(var(--radius) - 0.2rem);
        background-color: #c6d8d4;
        background-image:
          linear-gradient(180deg, rgba(16, 42, 51, 0.08), rgba(16, 42, 51, 0.2)),
          var(--portrait-image);
        background-size: cover, cover;
        background-position: center, center 20%;
      }

      .headshot-stage::after {
        content: "";
        position: absolute;
        inset: 0.75rem;
        border: 1px solid rgba(234, 243, 240, 0.26);
        border-radius: calc(var(--radius) - 0.32rem);
        pointer-events: none;
      }

      .hero-profile {
        padding: 1.15rem 1.3rem;
        background: rgba(255, 255, 255, 0.9);
      }

      .hero-profile .detail-item {
        padding-top: 0.85rem;
        border-top: 1px solid var(--line);
      }

      .hero-profile .detail-item:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .hero-profile .detail-item p {
        max-width: 25rem;
        font-size: 0.98rem;
      }

      .hero-status {
        display: grid;
        gap: 0.8rem;
        align-items: start;
        padding: 1rem 1.1rem;
        margin-top: 1rem;
        border: 1px solid rgba(23, 61, 71, 0.14);
        border-radius: 1rem;
        background: rgba(143, 175, 166, 0.12);
      }

      .status-main {
        display: grid;
        gap: 0.3rem;
      }

      .status-title {
        color: var(--heading);
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.45;
      }

      .status-link {
        width: max-content;
        color: var(--accent);
        font-size: 0.92rem;
        font-weight: 700;
        border-bottom: 1px solid rgba(23, 61, 71, 0.24);
      }

      .status-link:hover,
      .status-link:focus-visible {
        border-color: var(--accent);
      }

      /* Current */
      #current {
        --panel-line: rgba(74, 112, 132, 0.16);
        --panel-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.66));
        --panel-shadow: 0 8px 18px rgba(32, 70, 90, 0.025);
        background: linear-gradient(180deg, #eaf3f9 0%, rgba(239, 247, 251, 0.98) 100%);
        border-top-color: rgba(74, 112, 132, 0.16);
      }

      #current .eyebrow,
      #current .detail-label,
      #current .proof-label {
        color: #4a7084;
      }

      #icu .section-heading h2,
      #ltc .section-heading h2 {
        max-width: 12ch;
        font-size: clamp(3rem, 6.2vw, 5.6rem);
        line-height: 0.92;
      }

      .current-layout {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-areas:
          "intro"
          "pursuits"
          "presence"
          "learning";
        gap: 1rem;
      }

      .current-heading {
        display: grid;
        gap: 0.85rem;
        align-content: start;
        grid-area: intro;
      }

      .current-heading h2 {
        max-width: 10ch;
        font-size: clamp(2.6rem, 5vw, 4.5rem);
        line-height: 0.95;
      }

      .current-heading p {
        max-width: 24rem;
      }

      .current-card {
        display: grid;
        gap: 0.85rem;
        padding: clamp(1.2rem, 2.8vw, 1.45rem);
      }

      .current-card--pursuits {
        grid-area: pursuits;
      }

      .current-card--presence {
        grid-area: presence;
      }

      .current-card--learning {
        grid-area: learning;
      }

      .current-card h3 {
        font-size: clamp(1.34rem, 2.2vw, 1.62rem);
        line-height: 1.08;
      }

      .current-card-text {
        color: var(--heading);
        font-size: 0.98rem;
        line-height: 1.58;
      }

      .stacked-links {
        display: grid;
        gap: 0.75rem;
        margin-top: 0.15rem;
      }

      .stack-link {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        min-height: 3.15rem;
        padding: 0.82rem 1rem;
        border: 1px solid rgba(74, 112, 132, 0.18);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.66);
        color: var(--heading);
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.3;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          box-shadow 180ms ease;
      }

      .stack-link::after {
        content: "↗";
        color: rgba(74, 112, 132, 0.72);
        font-size: 0.8rem;
      }

      .stack-link:hover,
      .stack-link:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(74, 112, 132, 0.3);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 24px rgba(32, 70, 90, 0.06);
      }

      .stack-link--quest-primary {
        border-color: rgba(199, 175, 122, 0.34);
        background: linear-gradient(180deg, rgba(199, 175, 122, 0.16), rgba(199, 175, 122, 0.08));
        color: #5f4b22;
      }

      .stack-link--quest-primary::after {
        color: rgba(95, 75, 34, 0.7);
      }

      .stack-link--quest-primary:hover,
      .stack-link--quest-primary:focus-visible {
        border-color: rgba(199, 175, 122, 0.5);
        background: linear-gradient(180deg, rgba(199, 175, 122, 0.22), rgba(199, 175, 122, 0.12));
      }

      .stack-link--quest-secondary {
        background: linear-gradient(180deg, rgba(74, 112, 132, 0.08), rgba(74, 112, 132, 0.03));
      }

      .current-list {
        display: grid;
        gap: 0;
      }

      .current-list-item {
        padding: 0.68rem 0;
        border-top: 1px solid rgba(74, 112, 132, 0.14);
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .current-list-item:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .subpage-view {
        padding-top: clamp(1.6rem, 4vw, 2.5rem);
        background: linear-gradient(180deg, #eaf3f9 0%, rgba(241, 248, 251, 0.98) 100%);
        border-top-color: rgba(74, 112, 132, 0.16);
      }

      .subpage-back {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        color: #4a7084;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .subpage-layout {
        display: grid;
        gap: 1rem;
      }

      .subpage-note {
        max-width: 42rem;
        padding: 1.1rem 1.15rem;
        border-top-width: 2px;
        border-top-color: rgba(74, 112, 132, 0.22);
      }

      .subpage-note p {
        font-size: 0.95rem;
      }

      .subpage-view .eyebrow,
      .subpage-view .detail-label {
        color: #4a7084;
      }

      .subpage-view .work-body,
      .subpage-view .work-details {
        border-top-width: 2px;
        border-top-color: rgba(74, 112, 132, 0.22);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 10px 20px rgba(32, 70, 90, 0.03);
      }

      /* Current Work */
      .work-layout {
        display: grid;
        gap: 1.15rem;
      }

      .work-body,
      .work-details {
        padding: clamp(1.35rem, 3vw, 2rem);
      }

      .work-body {
        display: grid;
        gap: 0.9rem;
      }

      .work-body-block {
        display: grid;
        gap: 0.55rem;
      }

      .work-body-block + .work-body-block {
        padding-top: 0.25rem;
        border-top: 1px solid rgba(16, 42, 51, 0.08);
      }

      .work-body-block h3 {
        color: var(--heading);
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .work-body p:first-child {
        color: var(--heading);
        font-size: clamp(1.08rem, 1.6vw, 1.2rem);
      }

      .work-emphasis {
        padding-left: 1rem;
        border-left: 2px solid var(--sage);
        color: var(--heading);
        font-weight: 600;
      }

      .work-details {
        --detail-card-line: var(--panel-line, var(--line));
        --detail-card-surface: rgba(255, 255, 255, 0.46);
        display: grid;
        gap: 0.9rem;
      }

      .work-details .detail-list {
        grid-template-columns: 1fr;
        gap: 0.9rem;
      }

      .work-details .detail-item {
        gap: 0.45rem;
        padding: 1rem 1.05rem;
        border: 1px solid var(--detail-card-line);
        border-radius: 0.95rem;
        background: var(--detail-card-surface);
      }

      .work-details .detail-item p {
        max-width: none;
        font-size: 0.95rem;
        line-height: 1.62;
      }

      .proof-item h3,
      .approach-item h3 {
        font-size: clamp(1.45rem, 2.8vw, 1.9rem);
        line-height: 1.02;
      }

      .photo-backed > .container {
        position: relative;
        z-index: 1;
      }

      .photo-backed::before,
      .photo-backed::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .photo-backed::before {
        z-index: -2;
        background-image: var(--section-photo, none);
        background-size: cover;
        background-position: center;
        filter: blur(24px) saturate(0.9);
        transform: scale(1.06);
        opacity: 0;
      }

      .photo-backed::after {
        z-index: -1;
        background: var(--section-tint, transparent);
      }

      .hero {
        --section-photo: var(--hero-photo);
        --section-photo-opacity: var(--hero-photo-opacity);
        --section-tint:
          radial-gradient(circle at top left, rgba(143, 175, 166, 0.12), transparent 24%),
          linear-gradient(180deg, rgba(247, 251, 249, 0.64), rgba(242, 248, 246, 0.3));
      }

      #icu {
        --panel-line: var(--icu-line);
        --panel-surface: linear-gradient(180deg, rgba(255, 250, 244, 0.92), rgba(255, 248, 242, 0.82));
        --panel-shadow: 0 16px 30px rgba(67, 48, 35, 0.05);
        --section-photo: var(--icu-photo);
        --section-photo-opacity: var(--icu-photo-opacity);
        --section-tint:
          linear-gradient(180deg, rgba(245, 241, 235, 0.8), rgba(245, 241, 235, 0.94));
        background:
          linear-gradient(180deg, rgba(245, 241, 235, 0.98), rgba(248, 244, 239, 0.98));
        border-top-color: var(--icu-line);
      }

      #ltc {
        --panel-line: var(--ltc-line);
        --panel-surface: linear-gradient(180deg, rgba(249, 252, 250, 0.92), rgba(244, 249, 245, 0.86));
        --panel-shadow: 0 16px 30px rgba(31, 68, 58, 0.05);
        --section-photo: var(--ltc-photo);
        --section-photo-opacity: var(--ltc-photo-opacity);
        --section-tint:
          linear-gradient(180deg, rgba(240, 247, 242, 0.92), rgba(243, 249, 244, 0.98));
        background:
          linear-gradient(180deg, #f0f7f2 0%, rgba(244, 249, 245, 0.98) 100%);
        border-top-color: var(--ltc-line);
      }

      #contact {
        --panel-line: var(--contact-line);
        --panel-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.04));
        --panel-shadow: 0 16px 32px rgba(8, 21, 26, 0.14);
        --section-photo: var(--contact-photo);
        --section-photo-opacity: var(--contact-photo-opacity);
        --section-tint:
          linear-gradient(180deg, rgba(18, 47, 56, 0.72) 0%, rgba(18, 47, 56, 0.94) 100%);
        background:
          linear-gradient(180deg, #183741 0%, var(--contact-bg) 100%);
        border-top-color: var(--contact-line);
      }

      #contact .section-heading h2,
      #contact .section-heading p,
      #contact .section-heading .eyebrow,
      #contact .contact-card p,
      #contact .detail-label,
      #contact .footer-summary,
      #contact .footer-note {
        color: var(--contact-text);
      }

      #contact .eyebrow::before {
        background: rgba(234, 243, 240, 0.52);
      }

      #contact .contact-card {
        background: var(--contact-surface);
        border-color: var(--contact-line);
        box-shadow: 0 14px 26px rgba(8, 21, 26, 0.14);
      }

      #icu .eyebrow,
      #icu .detail-label {
        color: var(--icu-accent);
      }

      #icu .section-subtitle,
      #icu .work-details .detail-item {
        border-color: var(--icu-line);
      }

      #icu .work-details {
        --detail-card-line: rgba(122, 91, 73, 0.16);
        --detail-card-surface: rgba(255, 251, 246, 0.62);
      }

      #ltc .eyebrow,
      #ltc .detail-label,
      #ltc .proof-label {
        color: var(--ltc-accent);
      }

      #ltc .section-subtitle,
      #ltc .compact-grid .proof-item,
      #ltc .work-details .detail-item,
      #ltc .teaser-card {
        border-color: var(--ltc-line);
      }

      #ltc .work-details {
        --detail-card-line: rgba(94, 128, 109, 0.16);
        --detail-card-surface: rgba(249, 252, 250, 0.74);
      }

      .super-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(199, 175, 122, 0.22);
        border-radius: 999px;
        background: rgba(199, 175, 122, 0.045);
        color: var(--contact-chip);
        font-size: 0.86rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .closing-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
      }

      /* Proof */
      .proof-grid {
        display: grid;
        gap: 1rem;
      }

      .proof-item {
        display: grid;
        gap: 0.7rem;
        padding: 1.25rem 1.2rem;
      }

      .proof-item p {
        color: var(--muted);
      }

      .proof-item .proof-meta {
        color: var(--heading);
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.55;
      }

      .proof-link {
        width: max-content;
        color: var(--accent);
        font-size: 0.94rem;
        font-weight: 700;
        border-bottom: 1px solid rgba(23, 61, 71, 0.24);
      }

      .proof-link:hover,
      .proof-link:focus-visible {
        border-color: var(--accent);
      }

      .section-stack {
        display: grid;
        gap: 1.2rem;
      }

      .section-subtitle {
        display: grid;
        gap: 0.45rem;
        padding-top: 1rem;
        border-top: 1px solid var(--panel-line, var(--line));
      }

      .section-subtitle h3 {
        font-size: clamp(1.24rem, 2.2vw, 1.55rem);
        line-height: 1.04;
      }

      .section-subtitle p {
        max-width: 42rem;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .compact-grid,
      .teaser-grid {
        display: grid;
        gap: 1rem;
      }

      .compact-grid .proof-item {
        background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 10px 22px rgba(16, 42, 51, 0.035);
      }

      .compact-grid .proof-item .proof-meta {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .teaser-card {
        display: grid;
        gap: 0.7rem;
        padding: 1.2rem 1.15rem;
        background: rgba(255, 255, 255, 0.44);
        box-shadow: none;
      }

      .teaser-card p {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .teaser-card .proof-label {
        opacity: 0.8;
      }

      .teaser-card h3 {
        font-size: clamp(1.25rem, 2.2vw, 1.5rem);
      }

      .approach-strip,
      .direction-list {
        display: grid;
        gap: 0;
        border-top: 1px solid var(--line);
      }

      .approach-item,
      .direction-item {
        display: grid;
        gap: 0.45rem;
        padding: 1.2rem 0;
        border-bottom: 1px solid var(--line);
      }

      .direction-item strong {
        color: var(--heading);
        font-size: 1.06rem;
      }

      /* Contact */
      .contact-card {
        display: grid;
        gap: 1.2rem;
        padding: clamp(1.35rem, 3vw, 1.9rem);
        max-width: 36rem;
      }

      .contact-actions {
        display: grid;
        gap: 1rem;
      }

      .contact-mail {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: max-content;
        max-width: 100%;
        min-height: 3rem;
        padding: 0.82rem 1.1rem;
        border: 1px solid rgba(234, 243, 240, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--contact-text);
        font-size: 0.94rem;
        font-weight: 600;
        overflow-wrap: anywhere;
        word-break: break-word;
        transition:
          transform 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .contact-mail:hover,
      .contact-mail:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(234, 243, 240, 0.38);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 28px rgba(8, 21, 26, 0.14);
      }

      .contact-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem 1rem;
      }

      .contact-links a {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 600;
        border-bottom: 1px solid transparent;
      }

      .contact-links a:hover,
      .contact-links a:focus-visible {
        color: var(--heading);
        border-color: var(--heading);
      }

      .footer {
        padding: 1.5rem 0 2.35rem;
        border-top: 1px solid var(--line);
      }

      .footer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: minmax(3.45rem, 1fr) auto;
        grid-template-areas:
          "summary logo"
          "note note";
        column-gap: 1.05rem;
        row-gap: 0.38rem;
        min-height: 7.4rem;
        align-items: center;
      }

      .footer-logo {
        grid-area: logo;
        display: block;
        width: clamp(5.1rem, 10vw, 6.6rem);
        height: auto;
        justify-self: end;
        align-self: center;
        flex: 0 0 auto;
        object-fit: contain;
      }

      .footer-summary {
        grid-area: summary;
        align-self: center;
        max-width: min(42rem, calc(100% - 7.5rem));
        font-size: 0.98rem;
        font-weight: 600;
        line-height: 1.55;
      }

      .footer-note {
        grid-area: note;
        justify-self: center;
        align-self: end;
        max-width: min(28rem, 84vw);
        font-size: clamp(0.3rem, 0.5vw, 0.38rem);
        line-height: 1.45;
        text-align: center;
        letter-spacing: 0.03em;
        color: var(--muted);
      }

      /* Motion */
      .reveal {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 460ms ease,
          transform 460ms ease;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Responsive */
      @media (min-width: 760px) {
        .header-row {
          display: flex;
          justify-content: space-between;
          gap: 1rem;
        }

        .header-actions-shell {
          justify-items: end;
        }

        .site-nav {
          gap: 0.75rem;
          overflow: visible;
        }

        .section-grid,
        .contact-grid {
          grid-template-columns: minmax(15rem, 0.8fr) minmax(0, 1.2fr);
          gap: 3rem;
          align-items: start;
        }

        .hero-stage {
          grid-template-columns: minmax(0, 1.4fr) minmax(14.5rem, 0.72fr);
          min-height: clamp(26rem, 62vh, 32rem);

          max-width: 41rem;

          grid-template-columns: repeat(2, minmax(0, 1fr));

          grid-template-areas:

          gap: 1.15rem;
        }

        .hero-aside {
          justify-items: end;
        }

        .headshot-shell {
          width: min(100%, 19rem);
          padding: 0.6rem;
        }

        .hero-profile {
          width: min(100%, 19rem);
        }

        .hero-status {
          grid-template-columns: auto minmax(0, 1fr) auto;
          gap: 1rem 1.2rem;
          align-items: center;
        }

        .status-main {
          min-width: 0;
        }

        .work-layout {
          grid-template-columns: minmax(0, 1.12fr) minmax(17rem, 0.88fr);
          align-items: start;
        }

        .subpage-layout {
          grid-template-columns: minmax(0, 1.08fr) minmax(17rem, 0.92fr);

        }

        .work-details .detail-list {
          grid-template-columns: 1fr;
        }

        .proof-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .compact-grid,
        .teaser-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .approach-strip,
        .direction-list {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          column-gap: 2rem;
        }
      }

      @media (min-width: 980px) {
        .section-heading {
          position: sticky;
          top: 6.7rem;
        }
      }

      @media (max-width: 1024px) {
        .brand-name--full {
          display: none;

        .brand-name--short {
          display: inline;
        }

        .brand-support {
          display: none;

      }

      @media (max-width: 759px) {

          gap: 0.8rem;

        .header-tools {
          gap: 0.5rem;

          padding: 1rem;
        }

        .work-details .detail-list {
          grid-template-columns: 1fr;

              } else {
                link.removeAttribute("aria-current");
              }
            });
            return;
          }

          var sections = ["current", "icu", "ltc", "contact"]
            .map(function (id) {
              return document.getElementById(id);
            })
            .filter(Boolean);

          if (!("IntersectionObserver" in window) || !sections.length) {
            return;
          }

          var observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (!entry.isIntersecting) {
                  return;
                }

                links.forEach(function (link) {
                  if (link.getAttribute("data-nav-link") === entry.target.id) {
                    link.setAttribute("aria-current", "page");
                  } else {
                    link.removeAttribute("aria-current");
                  }
                });
              });
            },
            {
              threshold: 0.35,
              rootMargin: "-20% 0px -45% 0px"
            }
          );

          sections.forEach(function (section) {
            observer.observe(section);
          });
        }

        function syncHash() {
          if (state.page !== "home" || !window.location.hash) {
            return;
          }

          var target = document.querySelector(window.location.hash);

          if (!target) {
            return;
          }

          window.requestAnimationFrame(function () {
            target.scrollIntoView();
          });
        }

        function initHeaderAutoHide() {
          if (typeof teardownHeaderAutoHide === "function") {
            teardownHeaderAutoHide();
            teardownHeaderAutoHide = null;
          }

          var header = document.querySelector(".site-header");

          if (!header) {
            return;
          }

          var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
          var lastScrollY = window.scrollY;
          var hidden = false;
          var compact = false;
          var focusWithin = false;
          var ticking = false;
          var upwardTravel = 0;
          var downwardTravel = 0;

          header.classList.remove("is-hidden");
          header.classList.remove("is-compact");

          function setCompact(nextCompact) {
            if (compact === nextCompact) {
              return;
            }

            compact = nextCompact;
            header.classList.toggle("is-compact", compact);
          }

          if (reducedMotion.matches) {
            setCompact(window.scrollY > 40);
            return;
          }

          function setHidden(nextHidden) {
            if (hidden === nextHidden) {
              return;
            }

            hidden = nextHidden;
            header.classList.toggle("is-hidden", hidden);
            upwardTravel = 0;
            downwardTravel = 0;
          }

          function updateHeaderVisibility() {
            ticking = false;

            var currentY = window.scrollY;
            var delta = currentY - lastScrollY;
            lastScrollY = currentY;

            if (focusWithin || currentY <= 6) {
              setCompact(false);
              setHidden(false);
              return;
            }

            setCompact(currentY > 40);

            if (Math.abs(delta) < 4) {
              return;
            }

            if (delta > 0) {
              downwardTravel += delta;
              upwardTravel = 0;
            } else {
              upwardTravel += Math.abs(delta);
              downwardTravel = 0;
            }

            if (!hidden && delta > 0 && currentY > 96 && downwardTravel > 34) {
              setHidden(true);
              return;
            }

            if (hidden && delta < 0 && upwardTravel > 16) {
              setHidden(false);
            }
          }

          function onScroll() {
            if (ticking) {
              return;
            }

            ticking = true;
            window.requestAnimationFrame(updateHeaderVisibility);
          }

          function onFocusIn() {
            focusWithin = true;
            setCompact(false);
            setHidden(false);
          }

          function onFocusOut() {
            window.requestAnimationFrame(function () {
              focusWithin = header.contains(document.activeElement);

              if (!focusWithin) {
                onScroll();
              }
            });
          }

          window.addEventListener("scroll", onScroll, { passive: true });
          header.addEventListener("focusin", onFocusIn);
          header.addEventListener("focusout", onFocusOut);

          teardownHeaderAutoHide = function () {
            window.removeEventListener("scroll", onScroll);
            header.removeEventListener("focusin", onFocusIn);
            header.removeEventListener("focusout", onFocusOut);
            header.classList.remove("is-hidden");
            header.classList.remove("is-compact");
          };
        }

        function bindEvents() {
          document.addEventListener("click", function (event) {
            var button = event.target.closest("[data-set-view], [data-set-lang]");

            if (!button) {
              return;
            }

            if (button.hasAttribute("data-set-view")) {
              state.viewPreference = button.getAttribute("data-set-view");
              writeStorage(STORAGE_KEYS.viewMode, state.viewPreference);
            }

            if (button.hasAttribute("data-set-lang")) {
              state.language = button.getAttribute("data-set-lang");
              writeStorage(STORAGE_KEYS.language, state.language);
            }

            renderApp();
          });

          window.addEventListener("resize", function () {
            if (state.viewPreference !== "auto") {
              return;
            }

            window.requestAnimationFrame(function () {
              renderApp();
            });
          });

          window.addEventListener("popstate", function () {
            renderApp();
          });
        }

        bindEvents();
        renderApp();
      })();
    </script>
  </body>
</html>
